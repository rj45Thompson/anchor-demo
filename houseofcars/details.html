<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Car details · House of Cars 3D Lot</title>
<meta name="description" content="One car from the House of Cars 3D lot concept: its 3D model, listed price, engine and figures with their sources, reviews, recalls, mods and owners' clubs. Unofficial concept.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* palette: copied from index.html :root (the dealer's site's own colours, READ 2026-11-05 from houseofcars.com theme CSS; the tints are the page's) */
:root{--accent:#f25827;--accent-dark:#c0370b;--bg:#0a0a0a;--bg2:#101010;--slate:#32393b;--ink:#fefefe;--accent-soft:#ff9b74;--panel:rgba(16,16,16,.9);--line:rgba(254,254,254,.13);--dim:#a3abb0;--read:#3fb27f;--derived:#d9a441;--absent:#d9534f;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 "Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent-soft)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 16px}
.dim{color:var(--dim)}
.kick{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-soft);font-weight:700}
.ico{flex:none}

/* the bar along the top */
header.top{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-size:16px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent)}
.pill{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:99px;color:var(--dim);white-space:nowrap}
#topnav{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
nav.jump{display:flex;gap:2px}
nav.jump button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--dim);padding:6px 10px;border-radius:8px}
nav.jump button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
nav.jump button:focus-visible{outline:2px solid var(--accent-soft)}
.toplot{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;padding:7px 12px;border:1px solid var(--line);border-radius:10px;white-space:nowrap}
.toplot:hover{border-color:var(--accent)}
@media (max-width:900px){nav.jump{display:none}.top .pill{display:none}}

/* the hero: the model to turn, the name, the price */
.hero{padding:22px 0 4px}
.hero .wrap{display:grid;gap:20px}
@media (min-width:900px){.hero .wrap{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:center;gap:40px}}
.stage{position:relative;container-type:inline-size;height:clamp(300px,58vh,620px);border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(60% 45% at 50% 80%,rgba(242,88,39,.22),transparent 72%),radial-gradient(120% 95% at 50% 25%,#1e2328 0%,#0e1012 58%,#0a0a0a 100%)}
.stage::before{content:"";position:absolute;left:8%;right:8%;bottom:9%;height:26%;background:radial-gradient(closest-side,rgba(255,255,255,.08),transparent);pointer-events:none}
.mark{position:absolute;left:0;right:0;top:38%;transform:translateY(-50%);display:flex;justify-content:center;pointer-events:none;user-select:none}
.mark span{font-weight:800;font-size:clamp(64px,12vw,180px);font-size:min(180px,calc(130cqw / var(--n,7)));line-height:1;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(254,254,254,.10)}
.stage model-viewer{position:absolute;inset:0;width:100%;height:100%;background:transparent;--poster-color:transparent;--progress-bar-height:0;opacity:0;transition:opacity .9s ease}
.stage model-viewer.on{opacity:1}
.stage .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.stage .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.stage .bar.done{opacity:0;transition:opacity .6s}
.stage .hint{position:absolute;left:16px;bottom:14px;margin:0;font-size:11.5px;letter-spacing:.06em;color:var(--dim);pointer-events:none}
.stage .about{all:unset;cursor:pointer;position:absolute;right:14px;bottom:10px;font-size:11.5px;font-weight:700;color:var(--dim);padding:4px 8px;border-radius:8px}
.stage .about:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.stage .mverr,.stage .nomodel{position:absolute;inset:auto 16px 44px 16px;margin:0;padding:10px 12px;border-radius:10px;font-size:13px;background:rgba(217,83,79,.16);border:1px solid rgba(217,83,79,.5)}
.stage .nomodel{background:rgba(255,255,255,.05);border-color:var(--line);inset:auto 16px 50% 16px;text-align:center}
.arbtn{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer}
.intro h1{margin:0;font-size:clamp(30px,4.2vw,50px);line-height:1.06;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.intro .sub{color:var(--dim);margin:10px 0 0;font-size:14px}
.price{margin:20px 0 0;font-size:clamp(34px,3.6vw,46px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.price.na{font-size:clamp(26px,2.8vw,32px)}
.price small{display:block;margin-top:9px;font-size:12px;font-weight:600;line-height:1.4;color:var(--dim);letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.chips span{font-size:12.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:1px;margin:20px 0 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line)}
.glance button{all:unset;cursor:pointer;background:var(--bg2);padding:12px 12px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.glance button:hover{background:#171717}
.glance button:focus-visible{outline:2px solid var(--accent-soft);outline-offset:-2px}
.glance .gl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.glance b{font-size:24px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.glance b i{font-style:normal;font-size:12px;font-weight:700;color:var(--accent-soft);margin-left:3px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:rgba(255,255,255,.05);transition:border-color .15s,background .15s,transform .15s}
.cta:hover{border-color:rgba(255,255,255,.4);transform:translateY(-1px)}
.cta.go{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 10px 26px -10px rgba(242,88,39,.75)}
.cta.go:hover{background:#ff6a3a;border-color:#ff6a3a}
.cta .ico{color:currentColor}
@media (max-width:520px){.ctas .cta{flex:1 1 calc(50% - 5px)}}
@media (max-width:719px){.stage{height:clamp(280px,46vh,420px)}}

/* the listing's own photos: a grid on a desktop, a strip to swipe on a phone; a tap opens the larger view */
.photos .sh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}
.photos .credit{margin:0;font-size:12.5px;color:var(--dim)}
.photos .credit a{color:var(--accent-soft);text-decoration:none;border-bottom:1px solid rgba(255,155,116,.35)}
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));grid-auto-flow:dense}
.ph{all:unset;cursor:zoom-in;position:relative;display:block;min-width:0;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#151719;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,opacity .4s}
.ph:hover img{transform:scale(1.04)}
.ph:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.ph.lead{grid-column:span 2;grid-row:span 2}
.ph .n{position:absolute;right:10px;bottom:10px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;pointer-events:none}
.swipe{display:none;margin:8px 0 0;font-size:12px;color:var(--dim)}
@media (max-width:719px){
  .gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px;padding:0 16px 4px;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .gallery::-webkit-scrollbar{display:none}
  .ph{flex:0 0 82%;scroll-snap-align:start}
  .ph.lead{grid-column:auto;grid-row:auto}
  .swipe{display:block}
}
.lb{position:fixed;inset:0;z-index:20;background:rgba(5,5,5,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 16px 24px;touch-action:pan-y}
.lb[hidden]{display:none}
.lb figure{margin:0;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.lb img{display:block;max-width:min(1200px,100%);max-height:calc(100vh - 150px);width:auto;height:auto;border-radius:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);background:#151719}
.lb figcaption{font-size:12.5px;color:var(--dim);text-align:center}
.lb figcaption a{color:var(--accent-soft)}
.lb figcaption b{color:var(--ink);margin-right:8px;font-variant-numeric:tabular-nums}
.lb button{all:unset;cursor:pointer;position:absolute;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid var(--line);color:var(--ink);font-size:26px;line-height:1}
.lb button:hover{background:var(--accent);border-color:var(--accent)}
.lb button:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.lb .lbx{top:12px;right:16px;font-size:22px}
.lb .lbp{left:16px;top:50%;transform:translateY(-50%)}
.lb .lbn{right:16px;top:50%;transform:translateY(-50%)}
@media (max-width:719px){.lb .lbp,.lb .lbn{top:auto;bottom:16px;transform:none}.lb .lbp{left:calc(50% - 56px)}.lb .lbn{right:calc(50% - 56px)}.lb{padding-bottom:80px}}

/* the sections */
section.blk{padding:52px 0 0;scroll-margin-top:60px}
.sh{margin:0 0 18px}
.sh h2{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:800;line-height:1.15}
.sh .kick::before{content:"";display:inline-block;width:18px;height:2px;background:var(--accent);vertical-align:middle;margin-right:8px}
.sh p.note{margin:8px 0 0;color:var(--dim);font-size:13px;max-width:640px}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(255,255,255,.025);min-width:0}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.duo{display:grid;gap:16px}
@media (min-width:900px){.duo{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.duo.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.meta{font-size:12.5px;color:var(--dim);overflow-wrap:anywhere}
.srcs{font-size:12px;color:var(--dim);margin:10px 0 0;overflow-wrap:anywhere}
.srcs a,.meta a,.src a{color:var(--accent-soft);text-decoration:none;border-bottom:1px solid rgba(255,155,116,.35)}
.srcs a:hover,.meta a:hover,.src a:hover{border-bottom-color:var(--accent-soft)}
.badge{all:unset;cursor:pointer;display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:5px;line-height:1.4;white-space:nowrap}
.badge:focus-visible{outline:2px solid var(--accent-soft)}
.k-READ{background:var(--read);color:#062}
.k-DERIVED{background:var(--derived);color:#430}
.k-UNRESOLVED{background:var(--derived);color:#430}.k-ABSENT{background:var(--absent);color:#fff}
.k-OTHER{background:var(--slate);color:var(--ink)}

/* engine and figures: the big-number tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0;padding:16px 16px 14px;border-radius:16px;border:1px solid var(--line);cursor:pointer;text-align:left;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.012) 70%);transition:border-color .2s,transform .2s,background .2s}
.tile::after{content:"";position:absolute;left:16px;right:16px;top:0;height:2px;border-radius:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.tile:hover{border-color:rgba(255,255,255,.28);transform:translateY(-2px)}
.tile:hover::after,.tile.open::after{transform:scaleX(1)}
.tile:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.tile.open{grid-column:1/-1;border-color:rgba(242,88,39,.55);transform:none;background:linear-gradient(160deg,rgba(242,88,39,.10),rgba(255,255,255,.012) 70%)}
.tile.der{border-style:dashed;border-color:rgba(217,164,65,.55)}
.tile .th{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.tile .val{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 5px;margin-top:6px}
.tile .num{font-size:clamp(32px,3.4vw,44px);font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .num.long{font-size:20px;letter-spacing:0;line-height:1.2}
.tile .num.na{font-size:19px;font-weight:700;font-style:italic;color:var(--dim);letter-spacing:0;line-height:1.3}
.tile .unit{font-style:normal;font-size:14px;font-weight:700;color:var(--accent-soft)}
.tile .more{font-size:12px;color:var(--dim);line-height:1.35;min-height:1.35em}
.tile .src{display:none;margin:8px 0 0;padding:10px 0 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45;color:#cfd5dc;overflow-wrap:anywhere;cursor:auto}
.tile.open .src{display:block}
.tile .tap{font-size:10.5px;color:var(--dim);margin-top:2px;opacity:.75}
.tile.open .tap{display:none}
.tilenote{margin:12px 0 0;font-size:12.5px;color:var(--dim)}

/* the engine, gearbox and drive rows, and the listing's rows */
.rows{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.02)}
.row{display:grid;grid-template-columns:118px minmax(0,1fr) auto;grid-template-areas:"lab v b" "src src src";gap:4px 14px;align-items:start;padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .lab{grid-area:lab;color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding-top:3px}
.row .v{grid-area:v;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.row .v.na{color:var(--dim);font-style:italic}
.row .badge{grid-area:b;margin-top:2px}
.row .src{grid-area:src;margin:6px 0 0;font-size:12px;color:var(--dim);overflow-wrap:anywhere}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"lab b" "v v" "src src"}}
.rowshead{margin:22px 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}

/* the simulated lap */
.lap{position:relative;overflow:hidden;border-radius:18px;padding:22px;border:1px solid rgba(242,88,39,.4);background:linear-gradient(135deg,rgba(242,88,39,.18),rgba(242,88,39,.03) 62%),var(--bg2)}
.lap::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:18px solid rgba(242,88,39,.08);pointer-events:none}
.lap .t{display:block;margin:6px 0 10px;font-size:clamp(42px,5vw,60px);font-weight:800;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.lap .t.na{font-size:24px;font-style:italic;color:var(--dim)}
.lap p{margin:0;font-size:13px;color:#cfd5dc;line-height:1.5}
.lap p.ref{margin-top:10px;color:var(--dim);font-size:12.5px}

/* reviews */
.ratings{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.rate{display:inline-flex;flex-direction:column;gap:1px;padding:10px 14px;border-radius:12px;background:rgba(242,88,39,.12);border:1px solid rgba(242,88,39,.42);text-decoration:none;color:var(--ink);max-width:100%;transition:border-color .15s,transform .15s}
.rate:hover{border-color:var(--accent);transform:translateY(-1px)}
.rate b{font-size:22px;font-weight:800;line-height:1.15}
.rate span{font-size:11.5px;color:var(--dim)}
.norate{margin:0 0 14px;font-size:13px;color:var(--dim)}
.ai{border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.ai .who{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;font-size:12px;color:var(--dim);line-height:1.4}
.ai .who b{flex:none;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:5px;border:1px solid var(--accent-soft);color:var(--accent-soft)}
.ai p.sum{margin:0;font-size:14.5px;line-height:1.6;color:#e4e8ec}
.ai blockquote{margin:10px 0 0;padding-left:12px;border-left:2px solid var(--accent);font-style:italic;font-size:13.5px}
.gen{margin:12px 0 0;font-size:12px;color:var(--dim)}
ul.issues{list-style:none;margin:0;padding:0}
ul.issues li{padding:12px 0;border-top:1px solid var(--line)}
ul.issues li:first-child{border-top:0;padding-top:0}
ul.issues li p{margin:0;font-size:14px;line-height:1.5}
ul.issues li p.srcs{margin-top:5px}
.recalls{margin-top:16px}
.rchead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 8px}
.rchead b{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rchead span{font-size:14px;color:#cfd5dc}
.recalls details{border-top:1px solid var(--line);padding:10px 0}
.recalls summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style:none}
.recalls summary::-webkit-details-marker{display:none}
.recalls summary::before{content:"+";color:var(--accent-soft);font-weight:800;width:12px}
.recalls details[open] summary::before{content:"-"}
.recalls summary b{font-size:14px}
.recalls summary .tag{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.recalls summary .when{font-size:12px;color:var(--dim)}
.recalls details p{margin:8px 0 0 22px;font-size:13px;line-height:1.55;color:#cfd5dc}
.caveat{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:rgba(217,164,65,.09);border:1px solid rgba(217,164,65,.32);font-size:12.5px;color:#e6d3ad}

/* mods and clubs */
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.mod h3{margin:0 0 6px;font-size:15.5px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:800;line-height:1.35}
.mod p{margin:0;font-size:13.5px;line-height:1.55;color:#cfd5dc}
.mod p.mc{margin-top:8px;font-size:12.5px;color:#e6d3ad;font-style:italic}
.modnote{margin:14px 0 0;padding:12px 14px;border-radius:12px;border:1px solid rgba(217,83,79,.45);background:rgba(217,83,79,.08);font-size:13px}
a.club,div.club{position:relative;display:flex;flex-direction:column;gap:4px;padding:16px 16px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-decoration:none;color:var(--ink);min-width:0;transition:border-color .2s,transform .2s}
a.club:hover{border-color:var(--accent);transform:translateY(-2px)}
.club.ab{border-left:3px solid var(--accent)}
.club .ck{display:flex;gap:6px;flex-wrap:wrap;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.club .ck em{font-style:normal;color:#fff;background:var(--accent);padding:0 6px;border-radius:4px;letter-spacing:.08em}
.club b{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.club .h{font-size:12px;color:var(--accent-soft)}

/* the end of the page */
