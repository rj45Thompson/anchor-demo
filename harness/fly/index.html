<script>'use strict';
const $=(id)=>document.getElementById(id), Q=new URLSearchParams(location.search), MAXFPS=Number(Q.get('maxfps')||0);
const reducedQuery=matchMedia('(prefers-reduced-motion: reduce)'); const reduced=()=>reducedQuery.matches;
const D_TITLE=document.title.split(',')[0], FOV=50*Math.PI/180, TAN=Math.tan(FOV/2), EXPOSURE=1.3, BG=[11/255,18/255,25/255];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=(a)=>{ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; };
const hex=(c)=>[parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255];
const ease=(t)=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function mul4(a,b){ const o=new Float32Array(16); for(let c=0;c<4;c++) for(let r=0;r<4;r++){ let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; } return o; }
function lookAt(e,t){ const z=norm(sub(e,t)), x=norm(cross([0,1,0],z)), y=cross(z,x); return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]); }
// a perspective with its centre moved to (cx,cy) in clip space: the room the panels leave is where the eye looks, and what is square on stays square on
function perspective(aspect,near,far,cx,cy,z01){ const t=1/TAN, m=new Float32Array(16); m[0]=t/aspect; m[5]=t; m[8]=-cx; m[9]=-cy; m[11]=-1; if(z01){ m[10]=far/(near-far); m[14]=near*far/(near-far); } else { m[10]=(far+near)/(near-far); m[14]=2*far*near/(near-far); } return m; }

/* The shaders, twice: WGSL for WebGPU, GLSL for the fallback. Same quads, same glow, so the same scene looks the same either way. Everything adds into a floating point target and is tone mapped at the end, which keeps thousands of overlapping lines from burning to white. */
const WGSL_COMMON=`struct U { vp:mat4x4f, res:vec2f, time:f32, mixT:f32, dim:f32, scale:f32, lineW:f32, minPx:f32 };
@group(0) @binding(0) var<uniform> u:U;`;
const WGSL_POINT=WGSL_COMMON+`
struct PO { @builtin(position) pos:vec4f, @location(0) uv:vec2f, @location(1) c:vec3f, @location(2) s:f32, @location(3) g:f32 };
@vertex fn vs(@builtin(vertex_index) i:u32, @location(0) p:vec3f, @location(1) size:f32, @location(2) col:vec3f, @location(3) style:f32, @location(4) gains:vec2f)->PO {
  var q=array<vec2f,4>(vec2f(-1,-1),vec2f(1,-1),vec2f(-1,1),vec2f(1,1)); var o:PO; let clip=u.vp*vec4f(p,1.0); let g=mix(gains.x,gains.y,u.mixT)*u.dim;
  o.uv=q[i]; o.c=col; o.s=style; o.g=g;
  if(g<.004||size<=0.0||clip.w<.5){ o.pos=vec4f(2.0,2.0,2.0,1.0); return o; }
  var least=select(u.minPx,u.minPx*3.0,style>.5); if(style>4.5){ least=u.minPx*1.25; } let r=max(size*u.scale/clip.w*.5,least)*1.6;
  o.pos=clip+vec4f(q[i]*r*2.0/u.res*clip.w,0.0,0.0); return o; }
@fragment fn fs(i:PO)->@location(0) vec4f {
  let d=length(i.uv)*1.6; var a=0.0;
  if(i.s<.5){ let k=smoothstep(1.0,.15,d); a=(.55+.9*k*k)*k+.16*exp(-d*d*1.3); }
  else if(i.s<1.5){ a=1.5*smoothstep(1.0,.9,d)+.3*exp(-d*d*1.1); }
  else if(i.s<2.5){ a=1.3*smoothstep(.12,.05,abs(d-.88))+1.5*smoothstep(.46,.38,d)+.2*exp(-d*d*1.2); }
  else if(i.s<3.5){ a=1.2*smoothstep(.11,.04,abs(d-.88))+.05*exp(-d*d*1.4); }
  else if(i.s<4.5){ let t=atan2(i.uv.y,i.uv.x); a=.9*smoothstep(.1,.04,abs(d-.85))*smoothstep(-.2,.2,sin(t*7.0+u.time*.4)); }
  else { let m=(abs(i.uv.x)+abs(i.uv.y))*1.6; a=1.3*smoothstep(1.0,.82,m)+.12*exp(-d*d*1.2); }
  return vec4f(i.c*a*i.g,1.0); }`;
const WGSL_LINE=WGSL_COMMON+`
struct LO { @builtin(position) pos:vec4f, @location(0) v:f32, @location(1) c:vec3f, @location(2) g:f32 };
@vertex fn vs(@builtin(vertex_index) i:u32, @location(0) a:vec3f, @location(1) w:f32, @location(2) b:vec3f, @location(3) col:vec3f, @location(4) gains:vec2f)->LO {
  var q=array<vec2f,4>(vec2f(0,-1),vec2f(1,-1),vec2f(0,1),vec2f(1,1)); var o:LO; o.v=q[i].y; o.c=col; o.g=mix(gains.x,gains.y,u.mixT)*u.dim;
  var ca=u.vp*vec4f(a,1.0); var cb=u.vp*vec4f(b,1.0); let n=.5;
  if(o.g<.004||(ca.w<n&&cb.w<n)){ o.pos=vec4f(2.0,2.0,2.0,1.0); return o; }
  if(ca.w<n){ ca=mix(ca,cb,(n-ca.w)/(cb.w-ca.w)); } if(cb.w<n){ cb=mix(cb,ca,(n-cb.w)/(ca.w-cb.w)); }
  var d=(cb.xy/cb.w-ca.xy/ca.w)*u.res; let l=length(d); if(l<.001){ d=vec2f(1.0,0.0); } else { d=d/l; }
  let off=vec2f(-d.y,d.x)*q[i].y*(w*u.lineW+1.0)/u.res*2.0; let c=mix(ca,cb,q[i].x);
  o.pos=c+vec4f(off*c.w,0.0,0.0); return o; }
@fragment fn fs(i:LO)->@location(0) vec4f { let a=smoothstep(1.0,.2,abs(i.v)); return vec4f(i.c*a*i.g,1.0); }`;
const WGSL_PANEL=WGSL_COMMON+`
struct P { c:vec4f, r:vec4f, up:vec4f };

async function startScene(canvas,forced){ const notes=[];
  if(forced!=='webgl'){ try { const s=new WebGpuScene(); await s.init(canvas); return {scene:s,canvas,why:'Drawn directly with WebGPU and WGSL.'}; } catch(e){ notes.push(e.message); } }
  let c=canvas; if(forced!=='webgl'){ c=canvas.cloneNode(); canvas.replaceWith(c); }      // a canvas that has been offered to WebGPU may not accept another context
  try { const s=new WebGlScene(); await s.init(c); return {scene:s,canvas:c,why:(notes[0]?notes[0][0].toUpperCase()+notes[0].slice(1):'WebGPU was turned off')+', so the same scene is drawn with WebGL 2.'}; } catch(e){ notes.push(e.message); }

  resize(){ const v=$('view').getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2), w=Math.max(2,Math.round(v.width*dpr)), h=Math.max(2,Math.round(v.height*dpr)); this.dpr=dpr; this.scene.resize(w,h); this.deviceH=h; this.roomChanged(); }
