<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gate fly-through</title>
<meta name="description" content="Fly around a net that plays a game and hover a neuron to see its gate: how much of what you try to write there actually arrives, given everyone else writing into the same space.">
<!-- harness/gatefly/index.html - UC-GF-2, UC-GF-6. Reads a "neural-blueprint v1" file emitted by
     gatefly/gate_read.py, and the net's own priorgpt-format f16 checkpoint, which it RUNS in JS so
     the game plays while you fly it.

     WHY THIS IS NOT harness/fly/index.html WITH A NEW data.json. That page is GENERATED by
     .opus-tools/autobot/fly_manual.py, so a hand edit here would be overwritten; and its data
     contract is the manual's (nodeRows, harmony, readers, statMarks, panels-as-slides), none of
     which a net has. Filling those fields with placeholders to reuse the renderer is exactly the
     staging NO_TOYS forbids. So this is a separate page over a contract that fits a net, and it
     says so rather than implying the manual's viewer grew a feature. -->
<style>
:root{--bg:#0B1219;--panel:#121C26;--panel2:#16222E;--line:#2E4052;--fg:#F4F2EC;--soft:#C9D3DC;--muted:#A9B7C4;--accent:#F08A3C;--blue:#7FB2E5;--ok:#47D1A0;--bad:#FF8F6B;--warn:#F7C873;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;outline:none}
canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
#view{position:absolute;inset:0;overflow:hidden}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lab{position:absolute;left:0;top:0;font:600 12px/1.2 'Space Grotesk',system-ui,sans-serif;color:var(--soft);white-space:nowrap;text-shadow:0 1px 3px #0B1219,0 0 8px #0B1219;will-change:transform}
.lab.lane{color:var(--accent)}
#hud{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 12px;pointer-events:none;background:linear-gradient(180deg,rgba(11,18,25,.86) 0%,rgba(11,18,25,.5) 65%,rgba(11,18,25,0) 100%)}
#hud>*{pointer-events:auto}
#hereT{font:600 17px/1.2 'Space Grotesk',system-ui,sans-serif;margin:0}
#hereS{margin:2px 0 0;font-size:12.5px;color:var(--soft);max-width:72ch}
#stats{margin:4px 0 0;font:12px/1.5 var(--mono);color:var(--muted);max-width:86ch}
#stats b{color:var(--fg);font-weight:600}
#ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:46%}
button,select{background:#1D2C3A;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;min-height:32px}
button:hover,select:hover{border-color:var(--accent)}button[aria-pressed="true"]{background:var(--accent);color:#0B1219;border-color:var(--accent)}
#home{position:absolute;left:12px;bottom:170px;z-index:4;font:12.5px/1 'IBM Plex Sans',system-ui,sans-serif;color:var(--muted);text-decoration:none;background:rgba(18,28,38,.85);border:1px solid var(--line);border-radius:999px;padding:6px 11px}

#tip[hidden]{display:none}#tip .k{color:var(--muted)}#tip .n{font:600 13px/1.4 var(--mono)}
#tip h4{margin:0 0 3px;font:600 13px/1.3 'Space Grotesk',system-ui,sans-serif}

#side h3{margin:0 0 6px;font:600 14px/1.2 'Space Grotesk',system-ui,sans-serif}

#side td{padding:1px 0}#side td.v{text-align:right;color:var(--fg)}#side td.k{color:var(--muted)}
#board{display:grid;grid-template-columns:repeat(3,26px);gap:2px;margin:6px 0 4px}

#board div.x{color:var(--accent)}#board div.o{color:var(--blue)}#board div.last{border-color:var(--accent)}

@media (max-width:760px){#side{display:none}#ctl{max-width:60%}#legend{max-width:70vw}}
</style></head>
<body>
<a id="home" href="../../#gatefly">&larr; All projects</a>
<div id="view">
  <canvas id="c" tabindex="0" aria-label="The net's gate network. Drag to orbit, W A S D to fly, hover a unit to read its gate."></canvas>
  <div id="labels"></div>
  <div id="hud">
    <div>
      <h1 id="hereT">Gate fly-through</h1>
      <p id="hereS">loading&hellip;</p>
      <p id="stats"></p>
    </div>
    <div id="ctl">
      <select id="pick" aria-label="which net"></select>
      <button id="playBtn" aria-pressed="false">Play the game</button>
      <button id="colBtn">Colour: gate</button>
      <button id="edgeBtn" aria-pressed="true">Wires</button>
      <button id="measBtn">Measure the draw</button>
      <button id="homeBtn">Home</button>
    </div>
  </div>
  <p id="fail" hidden></p>
  <div id="legend">
    <h3>What the colour is</h3>
    <div id="bar"></div>
    <div class="ends"><span id="lo">0</span><span id="mid"></span><span id="hi">1</span></div>
    <p id="legP"></p>
  </div>
  <div id="side">
    <h3 id="sideT">The game</h3>
    <div id="board"></div>
    <table id="sideTab"></table>
  </div>
  <div id="tip" hidden></div>
</div>
<script>
'use strict';
const $=(id)=>document.getElementById(id), Q=new URLSearchParams(location.search);
/* the picker lists what is ACTUALLY on disk, from nets.json, rather than a hopeful list that
   errors when a net that was never emitted is chosen */
const bad=(m)=>{const f=$('fail');f.hidden=false;f.textContent=m;};

/* ---------------------------------------------------------------- maths */
/* COLUMN-MAJOR, like every other matrix on this page and like uniformMatrix4fv expects. Written
   row-major first, which multiplied in the opposite order and drew an entirely black canvas with
   every count still correct - the exact failure the repo's own rule warns about. */
function mul(a,b){const o=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}
  return o;}
function persp(fov,asp,n,f){const t=1/Math.tan(fov/2),o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function lookAt(e,c,up){
  const z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]];let l=Math.hypot(...z);z[0]/=l;z[1]/=l;z[2]/=l;
  let x=[up[1]*z[2]-up[2]*z[1],up[2]*z[0]-up[0]*z[2],up[0]*z[1]-up[1]*z[0]];l=Math.hypot(...x)||1;x[0]/=l;x[1]/=l;x[2]/=l;
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]), -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]), -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]), 1]);
}
/* the colour ramp the legend draws, so the two cannot drift apart */
const RAMP=[[0.11,0.23,0.36],[0.18,0.50,0.72],[0.28,0.82,0.63],[0.97,0.78,0.45],[0.94,0.54,0.24]];
function ramp(t){t=Math.max(0,Math.min(1,t));const x=t*(RAMP.length-1),i=Math.min(RAMP.length-2,Math.floor(x)),f=x-i;
  return [RAMP[i][0]+(RAMP[i+1][0]-RAMP[i][0])*f,RAMP[i][1]+(RAMP[i+1][1]-RAMP[i][1])*f,RAMP[i][2]+(RAMP[i+1][2]-RAMP[i][2])*f];}

/* ---------------------------------------------------------------- the net, run in JS
   A nanoGPT forward pass over the priorgpt checkpoint format (one f16 blob plus an index of
   {name, shape, offset, count} in ELEMENTS). This is what makes the page show a LIVE activation
   beside the static gate: the net really runs here, it is not a recording. */
function f16to32(u){ /* IEEE half -> float */
  const s=(u&0x8000)?-1:1,e=(u>>10)&0x1f,m=u&0x3ff;
  if(e===0) return s*m*Math.pow(2,-24);
  if(e===31) return m?NaN:s*Infinity;
  return s*(1024+m)*Math.pow(2,e-25);
}
class Ckpt{
  constructor(meta,buf){ this.meta=meta; const u=new Uint16Array(buf); this.f=new Float32Array(u.length);
    for(let i=0;i<u.length;i++) this.f[i]=f16to32(u[i]);
    this.ix={}; for(const t of meta.weights) this.ix[t.name]={shape:t.shape,off:t.offset,n:t.count}; }
  T(name){ const t=this.ix[name]; if(!t) throw new Error('checkpoint has no tensor '+name);
    return {d:this.f.subarray(t.off,t.off+t.n),shape:t.shape}; }
  has(name){ return !!this.ix[name]; }
}
function matvec(W,x,out){ /* W is (o,i) row-major; out = W x */
  const o=W.shape[0],n=W.shape[1],d=W.d;
  for(let r=0;r<o;r++){ let s=0,b=r*n; for(let k=0;k<n;k++) s+=d[b+k]*x[k]; out[r]=s; } return out; }
function layernorm(x,g,b,eps=1e-5){ const n=x.length; let m=0; for(let i=0;i<n;i++)m+=x[i]; m/=n;
  let v=0; for(let i=0;i<n;i++){const d=x[i]-m;v+=d*d;} v/=n; const s=1/Math.sqrt(v+eps);
  const o=new Float32Array(n); for(let i=0;i<n;i++) o[i]=(x[i]-m)*s*g.d[i]+b.d[i]; return o; }
class GPTjs{
  /* Keeps every ffwd hidden activation of the LAST position, which is the live channel. */
  constructor(ck){ this.ck=ck; this.h=ck.meta.hyper; }
  forward(tokens){
    const H=this.h,E=H.n_embed,L=H.n_layers,NH=H.n_heads,hs=E/NH,T=tokens.length,ck=this.ck;
    const tok=ck.T('token_embedding_table.weight'), pos=ck.T('position_embedding_table.weight');
    let X=[]; for(let t=0;t<T;t++){ const v=new Float32Array(E);
      for(let i=0;i<E;i++) v[i]=tok.d[tokens[t]*E+i]+pos.d[t*E+i]; X.push(v); }
    this.live={};
    for(let b=0;b<L;b++){
      const n1g=ck.T(`blocks.${b}.ln1.weight`),n1b=ck.T(`blocks.${b}.ln1.bias`);
      const Xn=X.map((v)=>layernorm(v,n1g,n1b));
      const cat=X.map(()=>new Float32Array(E));
      for(let h=0;h<NH;h++){
        const Wk=ck.T(`blocks.${b}.sa.heads.${h}.key.weight`),Wq=ck.T(`blocks.${b}.sa.heads.${h}.query.weight`),Wv=ck.T(`blocks.${b}.sa.heads.${h}.value.weight`);
        const K=[],V=[],Qq=[];
        for(let t=0;t<T;t++){ K.push(matvec(Wk,Xn[t],new Float32Array(hs)));
          Qq.push(matvec(Wq,Xn[t],new Float32Array(hs))); V.push(matvec(Wv,Xn[t],new Float32Array(hs))); }
        const sc=1/Math.sqrt(hs);
        for(let t=0;t<T;t++){ const w=new Float32Array(t+1); let mx=-Infinity;
          for(let u=0;u<=t;u++){ let s=0; for(let i=0;i<hs;i++) s+=Qq[t][i]*K[u][i]; w[u]=s*sc; if(w[u]>mx)mx=w[u]; }
          let z=0; for(let u=0;u<=t;u++){ w[u]=Math.exp(w[u]-mx); z+=w[u]; }
          for(let u=0;u<=t;u++) w[u]/=z;
          for(let i=0;i<hs;i++){ let s=0; for(let u=0;u<=t;u++) s+=w[u]*V[u][i]; cat[t][h*hs+i]=s; } }
      }
      const Wp=ck.T(`blocks.${b}.sa.proj.weight`),bp=ck.T(`blocks.${b}.sa.proj.bias`);
      for(let t=0;t<T;t++){ const o=matvec(Wp,cat[t],new Float32Array(E));
        for(let i=0;i<E;i++) X[t][i]+=o[i]+bp.d[i]; }
      const n2g=ck.T(`blocks.${b}.ln2.weight`),n2b=ck.T(`blocks.${b}.ln2.bias`);
      const W0=ck.T(`blocks.${b}.ffwd.net.0.weight`),b0=ck.T(`blocks.${b}.ffwd.net.0.bias`);
      const W2=ck.T(`blocks.${b}.ffwd.net.2.weight`),b2=ck.T(`blocks.${b}.ffwd.net.2.bias`);
      const hid=W0.shape[0];
      for(let t=0;t<T;t++){ const xn=layernorm(X[t],n2g,n2b);
        const u=matvec(W0,xn,new Float32Array(hid));
        for(let i=0;i<hid;i++) u[i]=Math.max(0,u[i]+b0.d[i]);
        if(t===T-1) this.live[`blocks.${b}.ffwd.net.2.weight`]=u.slice();
        const o=matvec(W2,u,new Float32Array(E));
        for(let i=0;i<E;i++) X[t][i]+=o[i]+b2.d[i]; }
    }
    const fg=ck.T('ln_f.weight'),fb=ck.T('ln_f.bias');
    const xf=layernorm(X[T-1],fg,fb);
    const Wh=ck.T('lm_head.weight'),bh=ck.T('lm_head.bias');
    const lg=matvec(Wh,xf,new Float32Array(Wh.shape[0]));
    for(let i=0;i<lg.length;i++) lg[i]+=bh.d[i];
    return lg;
  }
}

/* ---------------------------------------------------------------- an MLP, run in JS
   Same checkpoint format, different shape: layers.N.weight is (out, in). The live channel is
   every hidden layer's activation, so a pong neuron shows its activation beside its gate. */
class MLPjs{
  constructor(ck){ this.ck=ck; this.W=[]; this.b=[]; let i=0;
    while(ck.has('layers.'+i+'.weight')){ this.W.push(ck.T('layers.'+i+'.weight'));
      this.b.push(ck.T('layers.'+i+'.bias')); i++; } }
  forward(x){ let h=Float32Array.from(x); this.live={};
    for(let i=0;i<this.W.length;i++){ const o=matvec(this.W[i],h,new Float32Array(this.W[i].shape[0]));
      for(let r=0;r<o.length;r++) o[r]+=this.b[i].d[r];
      if(i<this.W.length-1) for(let r=0;r<o.length;r++) o[r]=Math.max(0,o[r]);
      // the units of site i+1 are THIS layer's outputs, so the live value belongs there
      if(i+1<this.W.length) this.live['layers.'+(i+1)+'.weight']=o.slice();
      h=o; }
    return h; }
}

/* ---------------------------------------------------------------- pong, in the page
   The SAME constants as gatefly/pong.py, so the browser plays the game the Python measured and
   a difference between them is a bug rather than a variant. */
const PW=1.0,PH=1.0,PAD_H=0.16,PAD_X=0.04,PAD_V=0.035,BALL_V=0.028;
class PongJS{
  constructor(seed){ this.s=seed>>>0||12345; this.score=[0,0]; this.reset(1); this.rallyBest=0;
    this.conceded=0; this.points=0; }
  rnd(){ this.s=(this.s*1664525+1013904223)>>>0; return this.s/4294967296; }
  reset(t){ this.bx=0.5; this.by=0.25+this.rnd()*0.5; const a=(this.rnd()-0.5)*1.1;
    this.vx=t*BALL_V*Math.cos(a); this.vy=BALL_V*Math.sin(a); this.ly=this.ry=0.5; this.rally=0; }
  state(side){ const bx=side>0?this.bx:PW-this.bx, vx=side>0?this.vx:-this.vx;
    const me=side>0?this.ry:this.ly, you=side>0?this.ly:this.ry;
    return [bx,this.by,vx/BALL_V,this.vy/BALL_V,me,you]; }
  predictY(side){ const px=side>0?PW-PAD_X:PAD_X;
    if((side>0&&this.vx<=0)||(side<0&&this.vx>=0)) return this.by;
    const t=(px-this.bx)/this.vx; let y=(this.by+this.vy*t)%(2*PH); if(y<0) y+=2*PH;
    return y<=PH?y:2*PH-y; }
  oracleDy(side){ const want=this.predictY(side), me=side>0?this.ry:this.ly;
    return Math.max(-PAD_V,Math.min(PAD_V,want-me)); }
  renorm(){ const s=Math.hypot(this.vx,this.vy); if(s>0){ this.vx*=BALL_V/s; this.vy*=BALL_V/s; }
    if(Math.abs(this.vx)<BALL_V*0.35){ this.vx=Math.sign(this.vx)*BALL_V*0.35;
      this.vy=Math.sign(this.vy)*Math.sqrt(Math.max(0,BALL_V*BALL_V-this.vx*this.vx)); } }
  step(l,r){ this.ly=Math.min(PH-PAD_H,Math.max(PAD_H,this.ly+Math.max(-PAD_V,Math.min(PAD_V,l))));
    this.ry=Math.min(PH-PAD_H,Math.max(PAD_H,this.ry+Math.max(-PAD_V,Math.min(PAD_V,r))));
    this.bx+=this.vx; this.by+=this.vy;
    if(this.by<0){ this.by=-this.by; this.vy=-this.vy; }
    else if(this.by>PH){ this.by=2*PH-this.by; this.vy=-this.vy; }
    if(this.bx<=PAD_X&&this.vx<0){ if(Math.abs(this.by-this.ly)<=PAD_H){
        this.bx=PAD_X+(PAD_X-this.bx); this.vx=-this.vx;
        this.vy+=(this.by-this.ly)/PAD_H*BALL_V*0.35; this.renorm(); this.rally++; }
      else { this.score[1]++; return 'right_scored'; } }
    if(this.bx>=PW-PAD_X&&this.vx>0){ if(Math.abs(this.by-this.ry)<=PAD_H){
        this.bx=(PW-PAD_X)-(this.bx-(PW-PAD_X)); this.vx=-this.vx;
        this.vy+=(this.by-this.ry)/PAD_H*BALL_V*0.35; this.renorm(); this.rally++; }
      else { this.score[0]++; return 'left_scored'; } }
    this.rallyBest=Math.max(this.rallyBest,this.rally); return 'alive'; }
}

/* ---------------------------------------------------------------- tic-tac-toe, in the page */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winner(b){ for(const [x,y,z] of LINES){ if(b[x]&&b[x]===b[y]&&b[y]===b[z]) return b[x]; } return 0; }
function legal(b){ const o=[]; for(let i=0;i<9;i++) if(!b[i]) o.push(i); return o; }
function turn(b){ let x=0,o=0; for(const v of b){ if(v===1)x++; else if(v===2)o++; } return x===o?1:2; }
function over(b){ return winner(b)!==0 || legal(b).length===0; }
const MEMO=new Map();
function val(b){ const k=b.join(''); if(MEMO.has(k)) return MEMO.get(k);
  let r; const w=winner(b);
  if(w===1) r=1; else if(w===2) r=-1; else { const ms=legal(b);
    if(!ms.length) r=0; else { const t=turn(b); let best=t===1?-2:2;
      for(const m of ms){ const c=b.slice(); c[m]=t; const v=val(c); best=t===1?Math.max(best,v):Math.min(best,v); }
      r=best; } }
  MEMO.set(k,r); return r; }
function bestMoves(b){ const t=turn(b),ms=legal(b); let bv=t===1?-2:2,out=[];
  for(const m of ms){ const c=b.slice(); c[m]=t; const v=val(c); if((t===1&&v>bv)||(t===2&&v<bv)){bv=v;out=[m];} else if(v===bv) out.push(m); }
  return out; }

/* ---------------------------------------------------------------- the scene */
const VS=`#version 300 es
layout(location=0) in vec3 p; layout(location=1) in vec3 col; layout(location=2) in float sz;
uniform mat4 mvp; uniform float hpx; out vec3 vc;
void main(){ gl_Position=mvp*vec4(p,1.0); vc=col;
  gl_PointSize=clamp(sz*hpx/max(0.001,gl_Position.w),2.0,42.0); }`;
const FS=`#version 300 es
precision highp float; in vec3 vc; out vec4 o;
void main(){ vec2 d=gl_PointCoord-vec2(0.5); float r=length(d);
  if(r>0.5) discard; float e=smoothstep(0.5,0.34,r);

const LVS=`#version 300 es

void main(){ gl_Position=mvp*vec4(p,1.0); vc=col; }`;
const LFS=`#version 300 es
precision highp float; in vec3 vc; out vec4 o; void main(){ o=vec4(vc,1.0); }`;

class App{
  constructor(nb,ck){

    this.gate=new Float32Array(nb.units.gate); this.a=new Float32Array(nb.units.a); this.c=new Float32Array(nb.units.c);
    this.layerOf=new Int32Array(nb.units.layer); this.indexOf=new Int32Array(nb.units.index);

    // the wires
    const E=nb.edges, n=E.kept; this.eN=n;
    const ep=new Float32Array(n*6), ec=new Float32Array(n*6);
    let wmax=1e-9; for(const w of E.w) wmax=Math.max(wmax,Math.abs(w));
    for(let e=0;e<n;e++){ const i=E.from[e],j=E.to[e],t=Math.min(1,Math.abs(E.w[e])/wmax);
      for(let k=0;k<3;k++){ ep[e*6+k]=this.pos[i*3+k]; ep[e*6+3+k]=this.pos[j*3+k]; }
      const neg=E.w[e]<0, cr=neg?[0.42,0.30,0.52]:[0.16,0.33,0.46];
      for(let v=0;v<2;v++) for(let k=0;k<3;k++) ec[e*6+v*3+k]=cr[k]*(0.30+0.95*t); }

      return `<h4>${L.kind} ${this.indexOf[i]} of ${L.units}</h4>

      <div><span class="k">median gate</span> <span class="n">${L.median_gate.toFixed(4)}</span></div>
      <div><span class="k">gate range</span> <span class="n">${L.min_gate.toFixed(4)} – ${L.max_gate.toFixed(4)}</span></div>
      <div><span class="k">median c/a</span> <span class="n">${L.median_crowding_fraction.toFixed(4)}</span></div>

  bind(){
    const cv=this.cv; let drag=null;
    cv.addEventListener('pointerdown',(e)=>{ cv.setPointerCapture(e.pointerId);
      drag={x:e.clientX,y:e.clientY,sh:e.shiftKey}; cv.style.cursor='grabbing'; });
    cv.addEventListener('pointermove',(e)=>{ if(drag){ const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
        if(drag.sh){ const s=this.v.dist*0.0016; this.target[1]+=dy*s;
          this.target[0]-=Math.sin(this.v.theta)*0*s; this.target[2]+=0; this.target[0]-=dx*s*Math.sin(this.v.theta)*-1; }
        else { this.v.theta+=dx*0.006; this.v.phi=Math.max(0.08,Math.min(Math.PI-0.08,this.v.phi-dy*0.006)); }
        drag.x=e.clientX; drag.y=e.clientY; $('tip').hidden=true; this.hover=-1; }

    cv.addEventListener('wheel',(e)=>{ e.preventDefault();

    this.keys={}; addEventListener('keydown',(e)=>{ this.keys[e.key.toLowerCase()]=true; });
    addEventListener('keyup',(e)=>{ this.keys[e.key.toLowerCase()]=false; });
    addEventListener('resize',()=>this.resize());
    $('colBtn').onclick=()=>{ const seq=['gate','a','c'].concat(this.ck?['live']:[]);
      this.mode=seq[(seq.indexOf(this.mode)+1)%seq.length]; this.recolour(); };
    $('edgeBtn').onclick=()=>{ this.showEdges=!this.showEdges;
      $('edgeBtn').setAttribute('aria-pressed',this.showEdges?'true':'false'); };

  }
  /* UC-GF-2 step 5 / REQ-GF-2c: the frame time is MEASURED, with the camera moving, and its

     when the page is not on screen:

                      the browser throttles rAF for a hidden or background page, so this is
                      only meaningful while the page is visible.

  drawCost(n){

  stats(){

  }
  /* pong's own panel: a drawn court, because a table of numbers is not a game you can watch */

  stepPong(now){

  step(now){

      if(mv>8||g.board[mv]!==0){ g.illegal++; g.l++; g.games++;
        g.msg='the net played an ILLEGAL move ('+(mv>8?'BOS':'cell '+mv+', taken')+'): counted a loss';
        g.board=[0,0,0,0,0,0,0,0,0]; g.moves=[]; g.last=-1; g.seat=g.seat===1?2:1; return; }
      g.board[mv]=g.seat; g.moves.push(mv); g.last=mv; g.msg='the net played cell '+mv;
    } else {
      const op=bestMoves(g.board); const m=op[(Math.random()*op.length)|0];
      g.board[m]=turn(g.board); g.moves.push(m); g.last=m; g.msg='the perfect opponent played '+m; }
  }
  frame(now){
    requestAnimationFrame((t)=>this.frame(t));
    const dt=Math.min(0.05,(now-this.last)/1000); this.last=now;
    this.frames.push(now-(this.prev||now)); this.prev=now;
    if(this.frames.length>240) this.frames.shift();
    if(this.meas){ this.v.theta+=0.012; this.meas.got.push(this.frames[this.frames.length-1]);
      if(this.meas.got.length>=this.meas.n){ const s=this.meas.got.slice(1).sort((a,b)=>a-b);
        const r={n:s.length,median:s[Math.floor(s.length/2)],p95:s[Math.floor(s.length*0.95)],
                 min:s[0],max:s[s.length-1]};
        this.v.theta=this.meas.theta0; this.meas.res(r); this.meas=null; } }
    // WASD flight
    const k=this.keys,sp=this.v.dist*1.1*dt;
    if(k['w']||k['s']||k['a']||k['d']||k['q']||k['e']){
      const e=this.eye(),f=[this.target[0]-e[0],this.target[1]-e[1],this.target[2]-e[2]];
      const l=Math.hypot(...f)||1; f[0]/=l;f[1]/=l;f[2]/=l;
      const r=[-f[2],0,f[0]],rl=Math.hypot(r[0],r[2])||1; r[0]/=rl;r[2]/=rl;
      const go=(v,s)=>{ for(let i=0;i<3;i++) this.target[i]+=v[i]*s; };
      if(k['w']) this.v.dist=Math.max(14,this.v.dist-sp);
      if(k['s']) this.v.dist=Math.min(this.span*9,this.v.dist+sp);
      if(k['a']) go(r,-sp); if(k['d']) go(r,sp);
      if(k['q']) this.target[1]-=sp; if(k['e']) this.target[1]+=sp;
    }
    if(this.playing&&this.net) this.step(now);
    this.resize();
    const gl=this.gl,M=this.mvp();
    gl.viewport(0,0,this.cv.width,this.cv.height);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    // Wires do not WRITE depth. A wire ends at a node's centre, at the node's own depth, so
    // with depth writes on it z-fought across the point sprite and carved a dark wedge out of
    // every dot - visible in the artifact, invisible in every count.
    if(this.showEdges&&this.eN){ gl.useProgram(this.lp);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.lp,'mvp'),false,M);
      gl.depthMask(false);
      gl.bindVertexArray(this.evao); gl.drawArrays(gl.LINES,0,this.eN*2);
      gl.depthMask(true); }
    gl.useProgram(this.pp);
    gl.uniformMatrix4fv(gl.getUniformLocation(this.pp,'mvp'),false,M);
    gl.uniform1f(gl.getUniformLocation(this.pp,'hpx'),this.cv.height*0.9);
    gl.bindVertexArray(this.vao); gl.drawArrays(gl.POINTS,0,this.N);
    gl.bindVertexArray(null);
    // labels
    // Labels fade with distance, so the far end of the corridor does not pile 19 of them into
    // one unreadable smear. The cap is visual only; every site is still in the file and in the
    // hover, and the HUD states the site count.
    for(const {L,d} of this.labs||[]){ const s=this.project([L.x,(L.grid_side*(L.cell||11))/2+18,0],M);
      if(!s){ d.style.display='none'; continue; } d.style.display='';
      const near=Math.max(0.12,Math.min(1,1.6-s.w/(this.span*0.75)));
      d.style.opacity=near.toFixed(2);
      d.style.transform=`translate(${Math.round(s.x)}px,${Math.round(s.y)}px) translate(-50%,-100%)`; }
    if(this.ptrDirty&&this.ptr){ this.ptrDirty=false; const hit=this.pick(this.ptr.x,this.ptr.y);
      const tip=$('tip');
      if(hit){ this.hover=hit.type==='unit'?hit.i:-1; tip.hidden=false; tip.innerHTML=this.tipFor(hit);
        const r=tip.getBoundingClientRect();
        tip.style.transform=`translate(${Math.min(innerWidth-r.width-8,this.ptr.x+14)}px,${Math.min(innerHeight-r.height-8,this.ptr.y+14)}px)`;
        this.cv.style.cursor='pointer'; }
      else { tip.hidden=true; this.hover=-1; this.cv.style.cursor='grab'; } }
    if(!this.sN||now-this.sN>400){ this.sN=now; this.stats(); this.side(); }
  }
}

/* ---------------------------------------------------------------- boot */
(async function(){
  const name=Q.get('net')||'ttt_small';
  let nb;
  try{ const r=await fetch('nb_'+name+'.json'); if(!r.ok) throw new Error('nb_'+name+'.json answered '+r.status);
    nb=await r.json(); }
  catch(e){ bad('No blueprint to fly: '+e.message+'. Emit one with  py -X utf8 -I gatefly/gate_read.py --name '+name); return; }
  if(nb.format!=='neural-blueprint v1'){ bad('That file says it is "'+nb.format+'", not "neural-blueprint v1".'); return; }
  $('hereT').textContent=nb.of+' · its gate network';
  $('hereS').textContent=nb.about||'';
  const sel=$('pick');
  try{ const mr=await fetch('nets.json'); const man=mr.ok?await mr.json():{nets:[]};
    for(const n of man.nets){ const o=document.createElement('option'); o.value=n.net;
      o.textContent=n.of+' · '+n.units+' units'+(n.parameters?' · '+n.parameters.toLocaleString()+' params':'');
      if(n.net===name) o.selected=true; sel.appendChild(o); } }
  catch(e){ const o=document.createElement('option'); o.value=name; o.textContent=name; sel.appendChild(o); }
  sel.onchange=()=>{ location.search='?net='+sel.value; };
  let ck=null;
  try{ const [mr,br]=await Promise.all([fetch(name+'.meta.json'),fetch(name+'.f16')]);
    if(mr.ok&&br.ok) ck=new Ckpt(await mr.json(),await br.arrayBuffer()); }
  catch(e){ /* the checkpoint is optional: without it the gates still fly, the game does not run */ }
  let app;
  try{ app=new App(nb,ck); }catch(e){ bad('The fly-through could not start: '+e.message); return; }
  if(ck){ try{
      if(nb.kind==='mlp'){ app.net=new MLPjs(ck); app.pong=new PongJS(20261118);
        const o=app.net.forward(app.pong.state(+1));
        if(!isFinite(o[0])) throw new Error('the forward pass gave NaN'); }
      else { app.net=new GPTjs(ck);
        // a smoke call, so a broken forward pass shows up now and not as a silent still picture
        const lg=app.net.forward([9]); if(!isFinite(lg[0])) throw new Error('the forward pass gave NaN'); }
    }catch(e){ app.net=null; bad('The net is here but will not run in the page: '+e.message); } }
  else { $('playBtn').disabled=true; $('playBtn').textContent='no checkpoint beside the blueprint'; }
  window.__gatefly={app,nb,
    counts:()=>({units:nb.units.n,sites:nb.checks.sites_drawn,refused:nb.checks.sites_refused,
                 edgesDrawn:nb.edges.kept,edgesDropped:nb.edges.dropped}),
    gateOf:(i)=>({gate:app.gate[i],a:app.a[i],c:app.c[i],
                  site:nb.layers[app.layerOf[i]].site,index:app.indexOf[i]}),
    /* the TEXT is built the same way the on-screen tooltip builds it, so this reads what the
       user reads and not a parallel description of it */
    hoverAt:(x,y)=>{ const h=app.pick(x,y); if(!h) return null;
      const d=document.createElement('div'); d.innerHTML=app.tipFor(h);
      return {hit:h,text:d.textContent.replace(/\s+/g,' ').trim(),html:app.tipFor(h),
              info:h.type==='unit'?window.__gatefly.gateOf(h.i):nb.layers[h.id]}; },
    unitAtScreen:()=>{ /* the unit nearest the middle of the view, for an automated hover */
      const M=app.mvp(),cx=app.cv.clientWidth/2,cy=app.cv.clientHeight/2;
      let best=-1,bd=1e18; for(let i=0;i<app.N;i++){ const s=app.project([app.pos[3*i],app.pos[3*i+1],app.pos[3*i+2]],M);
        if(!s) continue; const d=(s.x-cx)**2+(s.y-cy)**2; if(d<bd){bd=d;best=i;} }
      const s=app.project([app.pos[3*best],app.pos[3*best+1],app.pos[3*best+2]],M);
      return {i:best,x:s.x,y:s.y}; },
    measure:(n)=>app.measure(n||300),
    drawCost:(n)=>app.drawCost(n||300),
    /* step the game synchronously, so the net's play can be checked without waiting on rAF */
    stepGame:(n)=>{ let t=performance.now(); for(let i=0;i<(n||1);i++){ app.game.nextAt=0;
        app.pNext=0; app.step(t); t+=500; } return app.pong||app.game; },
    liveOf:(i)=>({live:app.live[i],has:!!app.hasLive[i]}),
    play:(on)=>{ app.playing=!!on; return app.game; },
    game:()=>app.pong||app.game,
    pong:()=>app.pong,
    frameStats:()=>{ const s=app.frames.slice().sort((a,b)=>a-b);
      return {n:s.length,median:s[Math.floor(s.length/2)],p95:s[Math.floor(s.length*0.95)]}; }};
})();
</script>
