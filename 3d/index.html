async function startScene(canvas,forced){ const notes=[];
  if(forced!=='webgl'){ try { const s=new WebGpuScene(); await s.init(canvas); return {scene:s,canvas,why:'Drawn directly with WebGPU and WGSL.'}; } catch(e){ notes.push(e.message); } }
  let c=canvas; if(forced!=='webgl'){ c=canvas.cloneNode(); canvas.replaceWith(c); }      // a canvas that has been offered to WebGPU may not accept another context
  try { const s=new WebGlScene(); await s.init(c); return {scene:s,canvas:c,why:(notes[0]?notes[0][0].toUpperCase()+notes[0].slice(1):'WebGPU was turned off')+', so the same scene is drawn with WebGL 2.'}; } catch(e){ notes.push(e.message); }
  const s=new NoScene(); await s.init(); return {scene:s,canvas:c,why:'This browser has neither WebGPU nor WebGL 2, so the graph cannot be drawn. The tree and the pages still work.'}; }

class SiteWorld {
  /* What stands where, as the arrays the scene draws: each slide two panels back to back (the scenes draw a panel from its front only, and a ring is seen from every side), a pin at its top and bottom, the chapters, documents and repositories as points, and the lines between them. Everything comes from data.json, which the builder read off the front page. */

class SitePage extends PagePanel {
  /* The page at the bottom, as the closed-loop fly-through has it, and one more thing: a chapter of the u2ue manual is read from u2ue's own page the first time one opens, so the words are u2ue's page's own, never a copy that can go stale. If that page cannot be read, the page says so and links to it. */

    try { const doc=await this.u2ue(); const el=doc.getElementById(item.anchor), sec=el&&(el.closest('section')||el); if(!sec) throw new Error("u2ue's page has no #"+item.anchor);
      if(this.id!==id) return; const node=this.relink(sec.cloneNode(true)); const first=node.firstElementChild; if(first&&/^H[12]$/.test(first.tagName)) first.remove();
      box.classList.remove('wait'); box.classList.add('u2ue'); box.replaceChildren(node); }
    catch(e){ console.error('A chapter did not load: '+e.message); if(this.id!==id) return; box.classList.remove('wait'); box.textContent="This chapter could not be read from u2ue's page ("+e.message+"). The link below opens it there."; } }

}

  picture(id,tier){ const sides=this.world.sidesOf.get(id), name=sides[0].name; return this.image('slides/'+name+(tier==='thumb'?'.thumb':'')+'.webp?v='+this.D.slideHash[name]).then((b)=>Promise.all(sides.map((p)=>this.scene.setPanelImage(p.index,b,tier))).then(()=>b.close())).catch((e)=>console.error('A slide picture did not load: '+e.message)); }

  loadFull(id){ if(!this.world.sidesOf.has(id)||this.scene.name==='none'||this.full.includes(id)) return; this.full.push(id); while(this.full.length>4){ const old=this.full.shift(); for(const p of this.world.sidesOf.get(old)) this.scene.dropPanelFull(p.index); } this.picture(id,'full'); }
  /* ---- where the camera goes for each kind of item: the builder worked out the box to frame, this fits it in the room the panels leave */
  viewOf(id){ const v=id?this.D.items[id].view:this.D.home; if(v.kind==='ring'){ const dist=this.fitAll(v); return {x:v.c[0],y:this.fitY,z:v.c[2],theta:this.homeTheta===undefined?v.a:this.homeTheta,phi:v.phi,dist}; }
    return {x:v.c[0],y:v.c[1],z:v.c[2],theta:v.a,phi:v.phi||Math.PI/2-.04,dist:this.cam.fitRect(v.w,v.h)}; }
  /* the overview's distance: as close as the free room allows with every point and every slide corner on screen, at every angle the overview turns

  fitAll(v){ const cam=this.cam, key=[cam.w,cam.h,cam.topGoal,cam.bottomGoal].join(); if(this.fitKey===key) return this.fitDist; const W=this.world, pts=[];
    for(let i=0;i<W.N;i++) pts.push(W.P(i)); for(const p of W.panels) if(p.side===1) for(const [i,j] of [[-1,-1],[1,-1],[1,1],[-1,1]]) pts.push([p.c[0]+p.right[0]*i,p.c[1]+p.up[1]*j,p.c[2]+p.right[2]*i]);
    const room=cam.visible(), screen=(m,[x,y,z])=>{ const w=m[3]*x+m[7]*y+m[11]*z+m[15]; return w<=.5?null:[(m[0]*x+m[4]*y+m[8]*z+m[12])/w*.5*cam.w+cam.w/2,-(m[1]*x+m[5]*y+m[9]*z+m[13])/w*.5*cam.h+cam.h/2]; };
    const at=(th,y,d)=>cam.vpFor({x:v.c[0],y,z:v.c[2],theta:th,phi:v.phi,dist:d}).m;
    const fits=(m)=>{ for(const p of pts){ const s=screen(m,p); if(!s||s[0]<room.l+14||s[0]>room.r-14||s[1]<room.t+8||s[1]>room.b-8) return false; } return true; };

      let top=Infinity, bottom=-Infinity; const m=at(v.a,y,worst); for(const p of pts){ const s=screen(m,p); if(s){ top=Math.min(top,s[1]); bottom=Math.max(bottom,s[1]); } }
      const shift=((top-room.t)-(room.b-bottom))/2; if(Math.abs(shift)<4) break; y-=shift*(2*worst*TAN/cam.h)/Math.sin(v.phi); }
    this.fitKey=key; this.fitDist=worst; this.fitY=y; return worst; }
  select(id,o){ o=o||{}; const it=this.D.items[id]; if(!it){ console.error('Nothing on this page is called '+id); this.goHome(); return; }
    this.cur=id; this.tree.setCurrent(id); this.markAlsoCurrent(id); this.page.show(id,it); this.cam.wandered=false; this.cam.fly(this.viewOf(id),!!o.instant); if(o.open!==false&&!(innerWidth<=760&&o.tour)) this.page.open(); this.light(id); this.hud(it);
    this.loadFull(id); if(it.slideOf) this.loadFull(it.slideOf); this.address(id,o); $('pageView').href=it.pageView; document.body.classList.add('chosen'); if(o.user&&this.playing&&!o.tour) this.stopTour(); if(o.user) this.closeDrawer(); }
  goHome(o){ o=o||{}; this.cur=null; this.homeTheta=undefined; this.tree.setCurrent(null); this.markAlsoCurrent(null); this.cam.wandered=false; this.cam.fly(this.viewOf(null),!!o.instant); this.light(null); $('hereT').textContent=this.D.title; $('hereS').textContent=this.D.said; $('hereD').textContent=''; $('pageView').href='../';
    if(o.address!==false) history.replaceState(null,'',location.pathname+location.search); }
  hud(it){ $('hereT').textContent=it.title; $('hereS').textContent=it.sub||''; $('hereD').textContent=''; $('sr').textContent=it.title; }
  address(id,o){ const url=location.pathname+location.search+'#'+encodeURIComponent(id); if(o.fromAddress) return; if(o.tour||o.instant) history.replaceState(null,'',url); else history.pushState(null,'',url); }
  fromAddress(first){ const id=decodeURIComponent(location.hash.slice(1)); if(id&&this.D.items[id]){ if(id!==this.cur) this.select(id,{instant:first,fromAddress:true}); } else { if(id) console.error('Nothing on this page is called '+id); this.goHome({instant:first,address:false}); } }
  light(id){ const W=this.world, D=this.D; if(!id){ this.focusLit.set(()=>({node:()=>1,edge:()=>.8}),1); for(const p of W.panels) this.scene.setPanelBrightness(p.index,1); return; }
    const mine=new Set(), lit=new Set([id].concat(D.items[id].family||[])); for(const f of lit) for(const i of (W.nodesOf.get(f)||[])) mine.add(i);
    const near=new Set(mine), ed=D.edges; for(let e=0;e<W.E;e++){ const a=ed[3*e],b=ed[3*e+1]; if(mine.has(a)) near.add(b); if(mine.has(b)) near.add(a); }
    for(const i of near) lit.add(D.nodes.item[i]);
    this.focusLit.set(()=>({node:(i)=>mine.has(i)?1:near.has(i)?.75:.2,edge:(e,a,b)=>(mine.has(a)||mine.has(b))?1.15:.1}),1);
    for(const p of W.panels) this.scene.setPanelBrightness(p.index,lit.has(p.item)?1:.42); }
  /* ---- the tour: every slide, in the front page's order */
  stopIndex(){ return this.D.stops.indexOf(this.cur); }
  goStop(n){ const S=this.D.stops; if(n>=S.length){ this.stopTour(); this.goHome(); return; } this.select(S[Math.max(0,n)],{tour:true}); }
  startTour(){ this.playing=true; $('tourPlay').setAttribute('aria-pressed','true'); this.lastAdvance=performance.now(); if(this.stopIndex()<0) this.goStop(0); }
  stopTour(){ this.playing=false; $('tourPlay').setAttribute('aria-pressed','false'); }
  /* ---- the view: drag to turn, scroll to zoom, a click picks, the keys fly */
  bindView(){ const c=this.canvas; let down=null, pinch=null; const pts=new Map();
    c.addEventListener('pointerdown',(e)=>{ c.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),dist:this.cam.v.dist}; down=null; return; } down={x:e.clientX,y:e.clientY,moved:false,pan:e.button===2||e.shiftKey,v:Object.assign({},this.cam.v)}; });
    c.addEventListener('pointermove',(e)=>{ const r=c.getBoundingClientRect(); this.ptr={x:e.clientX-r.left,y:e.clientY-r.top}; this.ptrDirty=true; if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pinch&&pts.size===2){ const [a,b]=[...pts.values()]; this.cam.free(); this.cam.v.dist=Math.max(8,Math.min(4000,pinch.dist*pinch.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)))); return; }
      if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; if(!down.moved&&Math.hypot(dx,dy)<5) return; down.moved=true; this.cam.free(); const v=this.cam.v;
      if(down.pan){ const s=v.dist*TAN*2/this.cam.h, rx=-Math.sin(v.theta), rz=Math.cos(v.theta); v.x=down.v.x-(dx*rx)*s; v.z=down.v.z-(dx*rz)*s; v.y=down.v.y+dy*s; }
      else { v.theta=down.v.theta+dx*.005; v.phi=Math.max(.08,Math.min(Math.PI-.08,down.v.phi-dy*.005)); } });
    const up=(e)=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(down&&!down.moved&&e.type==='pointerup'){ const r=c.getBoundingClientRect(), hit=this.picker.hit(e.clientX-r.left,e.clientY-r.top); if(hit) this.select(hit.item,{user:true}); } down=null; };
    c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up); c.addEventListener('contextmenu',(e)=>e.preventDefault());
    c.addEventListener('pointerleave',()=>{ this.ptr=null; this.tip.hide(); });
    c.addEventListener('wheel',(e)=>{ e.preventDefault(); this.cam.free(); this.cam.v.dist=Math.max(8,Math.min(4000,this.cam.v.dist*Math.exp(e.deltaY*.0012))); },{passive:false});
    const keyed=(e,on)=>{ const k=e.key.toLowerCase(); if('wasdqe'.includes(k)&&k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ this.keys[k]=on; e.preventDefault(); } };
    c.addEventListener('keydown',(e)=>{ keyed(e,true); if(e.key==='Enter'){ const r=c.getBoundingClientRect(), hit=this.picker.hit(r.width/2,this.cam.top+(this.cam.h-this.cam.top-this.cam.bottom)/2); if(hit) this.select(hit.item,{user:true}); } });
    c.addEventListener('keyup',(e)=>keyed(e,false)); c.addEventListener('blur',()=>{ this.keys={}; }); }
  closeDrawer(){ document.body.classList.remove('treeOpen'); $('menu').setAttribute('aria-expanded','false'); }
  bindControls(){ const b=document.body;
    $('menu').onclick=()=>{ const open=!b.classList.contains('treeOpen'); b.classList.toggle('treeOpen',open); $('menu').setAttribute('aria-expanded',String(open)); };
    $('scrim').onclick=()=>this.closeDrawer();
    $('treeHide').onclick=()=>{ b.classList.add('treeOff'); $('treeShow').hidden=false; this.resize(); }; $('treeShow').onclick=()=>{ b.classList.remove('treeOff'); $('treeShow').hidden=true; this.resize(); };
    $('tourPrev').onclick=()=>{ this.stopTour(); this.goStop(Math.max(0,this.stopIndex()-1)); }; $('tourNext').onclick=()=>{ this.stopTour(); this.goStop(this.stopIndex()+1); };
    $('tourPlay').onclick=()=>{ if(this.playing) this.stopTour(); else this.startTour(); };
    $('homeBtn').onclick=()=>{ this.stopTour(); this.goHome(); }; $('helpBtn').onclick=()=>this.select('help',{user:true});
    $('pagePrev').onclick=()=>{ const t=this.cur&&this.tree.step(this.cur,-1); if(t) this.select(t,{user:true}); }; $('pageNext').onclick=()=>{ const t=this.cur&&this.tree.step(this.cur,1); if(t) this.select(t,{user:true}); };
    $('pageCopy').onclick=()=>{ const url=location.href; (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject(new Error('no clipboard'))).then(()=>{ $('sr').textContent='Link copied'; $('pageCopy').textContent='Copied'; setTimeout(()=>{ $('pageCopy').textContent='Copy link'; },1600); }).catch((e)=>{ console.error('The link was not copied: '+e.message); $('pageCopy').textContent='Copy failed'; }); };
    $('filter').addEventListener('input',(e)=>this.tree.filter(e.target.value)); $('filter').addEventListener('keydown',(e)=>{ if(e.key==='ArrowDown'){ e.preventDefault(); const f=this.tree.visible()[0]; if(f) this.tree.focus(f); } });
    addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&b.classList.contains('treeOpen')) this.closeDrawer(); });
    /* Have Claude install it, in a card's page: the button beside a command puts the command on the clipboard, or selects it to copy by hand */
    this.page.inner.addEventListener('click',(e)=>{ const bt=e.target.closest('button.copy'); if(!bt) return; const code=bt.parentNode.querySelector('code'); if(!code) return;
      const said=(t)=>{ bt.textContent=t; setTimeout(()=>{ bt.textContent='Copy'; },1800); }, select=()=>{ const r=document.createRange(); r.selectNodeContents(code); const s=getSelection(); s.removeAllRanges(); s.addRange(r); said('Selected'); };
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code.textContent).then(()=>said('Copied'),select); else select(); }); }
  resize(){ const v=$('view').getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2), w=Math.max(2,Math.round(v.width*dpr)), h=Math.max(2,Math.round(v.height*dpr)); this.dpr=dpr; this.scene.resize(w,h); this.deviceH=h; this.roomChanged(); }
  roomChanged(){ const v=$('view').getBoundingClientRect(), hud=$('hud').getBoundingClientRect(), pg=this.page.el.getBoundingClientRect(); this.cam.setRoom(v.width,v.height,Math.max(0,Math.min(v.height*.4,hud.bottom-v.top-18)),Math.max(0,v.bottom-pg.top));
    if(this.cam.wandered) return; const want=this.viewOf(this.cur); if(this.cam.flight) this.cam.flight.to.dist=want.dist; else this.cam.fly(want,true); }
  /* ---- one frame */
  frame(now){ requestAnimationFrame((t)=>this.frame(t)); if(document.hidden){ this.lastFrame=now; return; } if(MAXFPS&&now-this.lastDraw<1000/MAXFPS) return; this.lastDraw=now; const dt=Math.min(.05,(now-this.lastFrame)/1000); this.lastFrame=now; const cam=this.cam;
    if(!this.cur&&!cam.wandered&&!cam.flight&&!reduced()){ cam.v.theta+=dt*.035; this.homeTheta=cam.v.theta; }     // the overview turns slowly, so every side of the ring comes round
    if(this.playing&&!cam.flight&&now-this.lastAdvance>6500){ this.goStop(this.stopIndex()+1); this.lastAdvance=now; }
    cam.update(now,dt,this.keys); const mix=this.focusLit.tick(now), vp=cam.matrices(!!this.scene.z01);
    this.scene.draw({vp,eye:cam.eye,time:(now-this.startTime)/1000,mix,dim:this.focusLit.dim,scale:this.deviceH*.9,lineW:(this.dpr||1),minPx:(this.dpr||1)*1.05}); this.pointer();
    this.fps.n++; if(now-this.fps.t>1000){ this.fps.v=this.fps.n*1000/(now-this.fps.t); this.fps.n=0; this.fps.t=now; } if(!cam.flight&&this.settleWaiters.length&&this.focusLit.mix>=1){ const w=this.settleWaiters; this.settleWaiters=[]; for(const f of w) f(); } }
  pointer(){ if(!this.ptrDirty||!this.ptr) return; this.ptrDirty=false; const hit=this.picker.hit(this.ptr.x,this.ptr.y); if(hit){ const it=this.D.items[hit.item]; const r=this.canvas.getBoundingClientRect(); this.tip.at(this.ptr.x+r.left,this.ptr.y+r.top,it.title+(it.sub?' · '+it.sub:'')); this.canvas.style.cursor='pointer'; } else { this.tip.hide(); this.canvas.style.cursor='grab'; } }
}

(async function(){ const forced=Q.get('renderer'), bad=(msg)=>{ const f=$('fail'); f.hidden=false; f.textContent=msg; console.error(msg); };
  let D; try { const r=await fetch('data.json?v=32eed2756f'); if(!r.ok) throw new Error('data.json answered '+r.status); D=await r.json(); } catch(e){ bad('The 3D view could not load its data ('+e.message+'). Every project is on the page view: ../'); return; }
  const started=await startScene($('c'),forced); const app=new SiteApp(D,started);
  window.__fly={renderer:started.scene.name,why:started.why,app,settle:()=>new Promise((res)=>app.settleWaiters.push(res)),state:()=>({cur:app.cur,pageOpen:app.page.isOpen,pageId:app.page.id,playing:app.playing,eye:app.cam.eye.slice(),view:Object.assign({},app.cam.v),fps:app.fps.v})};
})();
