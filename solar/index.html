<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar setup - 3D ray-traced configuration zoo</title>
<style>
  :root { --bg:#070a0e; --panel:#0f141c; --line:#222c3a; --ink:#e8eef7; --dim:#8598ae;
          --hot:#ffb347; --cool:#4fd1c5; --bad:#f07178; --good:#7ee787; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:12.5px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace; overflow:hidden; }

  /* Three rows that never overlap: controls, the 3D, the numbers. The previous build
     floated a scrolling column of text ON TOP of the scene, so the data hid the geometry
     and the geometry made the data unreadable. Only the geometry is 3D now; everything
     that is a number lives in a table. */
  #app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }

  #bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  #bar .grp { display:flex; gap:6px; align-items:center; }
  #bar label { color:var(--dim); font-size:11px; }
  select, button { background:#161d28; color:var(--ink); border:1px solid var(--line);
    border-radius:5px; padding:5px 9px; font:inherit; font-size:11.5px; cursor:pointer; }
  select:hover, button:hover { border-color:var(--cool); }
  button.on { border-color:var(--hot); color:var(--hot); }
  input[type=range] { accent-color:var(--hot); }

  #stage { position:relative; min-height:240px; }
  #stage canvas { position:absolute; inset:0; width:100% !important; height:100% !important;
    display:block; cursor:grab; }
  #keys { position:absolute; top:10px; right:12px; font-size:10.5px; color:var(--dim);
    text-align:right; text-shadow:0 1px 3px #000,0 0 8px #000; pointer-events:none; }
  kbd { background:rgba(22,29,40,.8); border:1px solid var(--line); border-radius:3px;
    padding:0 4px; color:var(--ink); }
  #tip { position:fixed; max-width:280px; padding:7px 9px; background:rgba(8,11,16,.96);
    border-left:2px solid var(--cool); font-size:11px; line-height:1.45; pointer-events:none;
    display:none; z-index:60; }
  #tip b { color:var(--cool); display:block; margin-bottom:3px; }

  #data { border-top:1px solid var(--line); background:var(--panel);
    display:grid; grid-template-columns:1fr 260px; height:37vh; min-height:200px; }
  #tblwrap { overflow:auto; }
  table { border-collapse:collapse; width:100%; font-size:11.5px; }
  th,td { padding:5px 9px; text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  thead th { position:sticky; top:0; background:#141b25; color:var(--dim); font-weight:600;
    border-bottom:1px solid var(--line); cursor:pointer; user-select:none; font-size:10.5px;
    letter-spacing:.04em; text-transform:uppercase; }
  thead th:hover { color:var(--cool); }
  thead th.sorted { color:var(--hot); }
  tbody tr { border-bottom:1px solid #1a222d; cursor:pointer; }
  tbody tr:hover { background:#141c26; }
  tbody tr.on { background:rgba(255,179,71,.12); }
  tbody tr.on td:first-child { box-shadow:inset 3px 0 0 var(--hot); }
  td.best { color:var(--good); font-weight:700; }
  .num { font-variant-numeric:tabular-nums; }
  #side { border-left:1px solid var(--line); padding:9px 11px; overflow:auto; }
  #side h3 { margin:0 0 6px; font-size:11.5px; color:var(--hot); }
  #side .r { display:flex; justify-content:space-between; padding:1px 0; color:var(--dim); }
  #side .r b { color:var(--ink); }
  #cum { width:100%; height:62px; display:block; margin:7px 0 3px; }
  .note { color:var(--dim); font-size:10.5px; line-height:1.45; margin:7px 0 0; }
  #err { position:fixed; inset:0; display:none; place-items:center; padding:40px;
    text-align:center; color:var(--bad); }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="grp"><label>mount</label><select id="mount"></select></div>
    <div class="grp"><label>mirror</label><select id="material"></select></div>
    <div class="grp"><label>$/m&sup2;</label>
      <input type="range" id="mirror" min="0" max="120" step="1" value="90" style="width:86px">
      <span id="mrate" style="color:var(--hot);width:44px"></span></div>
    <div class="grp" style="flex:1;min-width:170px"><label>sun</label>
      <input type="range" id="sun" min="0" max="14" step="1" value="4" style="flex:1">
      <span id="sunv" style="color:var(--dim);width:100px"></span></div>
    <div class="grp">
      <button id="play">&#10074;&#10074;</button>
      <button id="rays">rays</button>
      <button id="solo" class="on">solo</button>
      <button id="prev">&#9664;</button>
      <button id="next">next &#9654;</button>
      <button id="cycle">cycle</button>
      <button id="reset">reset view</button>
    </div>
  </div>

  <div id="stage">
    <div id="keys">
      <b style="color:var(--hot)">QUAKE CONTROLS</b><br>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> fly &nbsp; <kbd>Q</kbd><kbd>E</kbd> down/up<br>
      <kbd>shift</kbd> boost &nbsp; drag to look<br>
      hover a surface to identify it &nbsp;&middot;&nbsp; click it to jump to its row<br>
      <b>solo</b> shows one experiment &mdash; turn it off for the whole zoo
    </div>
  </div>

  <div id="data">
    <div id="tblwrap">
      <table>
        <thead><tr id="hdr"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="side">
      <h3 id="sname">&mdash;</h3>
      <canvas id="cum" width="560" height="124"></canvas>
      <div id="sdet"></div>
      <p class="note" id="matnote"></p>
      <p class="note" id="basis"></p>
    </div>
  </div>
</div>
<div id="tip"></div>
<div id="err"></div>

<script src="../three.min.js"></script>
<script src="zoo3d.js"></script>
<script>
(function () {
  "use strict";
  var D = window.SOLAR_ZOO3D;
  if (!D || !window.THREE) {
    var e = document.getElementById("err");
    e.style.display = "grid";
    e.textContent = !window.THREE ? "three.min.js did not load." : "zoo3d.js did not load.";
    return;
  }

  // No INV_PER_W here any more: the inverter is sized per design by the model and is already
  // inside c.cost. Keeping a second copy of the bill in this file is what went wrong before.
  var PA = 2.583, RATE = 0.18, LIFE = 25, SPACING = 9.0;
  var mirrorRate = 90, matIdx = 4, mountIdx = D.mounts.length - 1, cfgIdx = 0;
  var sunIdx = 4, playing = true, showRays = true, sortKey = "lcoe", sortDir = 1;
  // SOLO is the default because the zoo laid out all 18 side by side and the one you
  // picked was lost in the pile. RJ: "I can't see what's going on". One experiment fills
  // the screen; "all" still gives the overview.
  var solo = true;

  var MATERIALS = [
    { n:"film / mylar", cost:2, refl:0.85, deg:0.08,
      note:"Pennies per m² and genuinely reflective when new. Outdoors it hazes and lifts — ESTIMATE 8%/yr. Wins year one, loses the decade." },
    { n:"vinyl wrap on plywood", cost:24, refl:0.85, deg:0.04,
      note:"Chrome wrap smoothed onto ply and clear-coated. Wrap ~$12/m² + ply ~$12/m². ESTIMATE 4%/yr; the clear coat decides it." },
    { n:"acrylic mirror sheet", cost:60, refl:0.85, deg:0.02,
      note:"READ: $147–248 CAD per 4×8 sheet ≈ $50–83/m². UV-stable, but it scratches and bows in heat." },
    { n:"silvered polymer film (solar grade)", cost:40, refl:0.94, deg:0.01,
      note:"The real answer to 'highly reflective plastic, UV resistant': silvered polymer mirror film built for concentrators (ReflecTech, 3M Solar Mirror). NOT window tint. ⚠ PRICE AND SPEC UNVERIFIED — a search for it returned window film instead, so these numbers are from background knowledge, not a listing I read." },
    { n:"anodised aluminium", cost:35, refl:0.95, deg:0.005,
      note:"What real concentrators use, and it won an independent reflector shoot-out. Highest reflectivity AND slowest decay. ESTIMATE price." },
    { n:"glass mirror", cost:40, refl:0.93, deg:0.005,
      note:"Durable and reflective, but heavy and it breaks — the structure carries it and the hail has to miss. ESTIMATE price." },
    { n:"custom (use slider)", cost:null, refl:0.90, deg:0.02,
      note:"Set the cost yourself with the slider." }
  ];

  var COLS = [
    { k:"name", t:"configuration", f:function(c){ return c.name; } },
    { k:"peak", t:"peak W",     f:function(c){ return (c.peak*1000).toFixed(0); } },
    { k:"y1",   t:"year 1 kWh", f:function(c){ return c._e.annual.toFixed(0); } },
    { k:"y10",  t:"year 10",    f:function(c){ return (c._e.annual*Math.pow(1-c._e.deg,9)).toFixed(0); } },
    { k:"life", t:"25-yr kWh",  f:function(c){ return (c._e.life/1000).toFixed(1)+"k"; } },
    { k:"cost", t:"cost",       f:function(c){ return "$"+c._e.cost.toFixed(0); } },
    { k:"lcoe", t:"$/kWh life", f:function(c){ return "$"+c._e.lcoe.toFixed(4); }, best:"min" },
    { k:"pay",  t:"payback",    f:function(c){ return c._e.payback ? c._e.payback+" yr" : "never"; } },
    { k:"net",  t:"25-yr net",  f:function(c){ return "$"+Math.round(c._e.net).toLocaleString(); }, best:"max" },
    { k:"deg",  t:"decay/yr",   f:function(c){ return (c._e.deg*100).toFixed(2)+"%"; } }
  ];
  function val(c,k) {
    return { name:c.name, peak:c.peak, y1:c._e.annual, y10:c._e.annual*Math.pow(1-c._e.deg,9),
             life:c._e.life, cost:c._e.cost, lcoe:c._e.lcoe, pay:c._e.payback||99,
             net:c._e.net, deg:c._e.deg }[k];
  }

  function econ(c) {
    // mirrorShare comes from the model, which compares each design against ITSELF with the
    // reflectors removed. Deriving a baseline here (the old code took the weakest config whose
    // `ratio` was 0 - which included the side-mirror platforms, since they carry their area in
    // `edge_mirror`) billed the gain from TRACKING to the mirrors.
    var m = MATERIALS[matIdx];
    var share = c.mirrorShare, mirrored = c.mirrorM2 > 0;
    var bare = c.annual * (1 - share);
    var annual = mirrored ? bare + (c.annual-bare)*(m.refl/0.90) : c.annual;
    var deg = mirrored ? 0.005 + share*Math.max(0, m.deg-0.005) : 0.005;
    // Take the cost the model computed and adjust ONLY the mirror material, which is the one
    // thing this control changes. Re-deriving the whole bill here is what put the heliostat
    // ring at the top of the table: that copy dropped the mirror's BACKING STRUCTURE
    // ($60/m² of reflector, and the ring carries 5.2 m² of it), dropped the tilt axis, and
    // could not know a heliostat needs two actuators per mirror instead of one shared shaft.
    // The error grew with mirror area, so it flattered the most mirror-heavy design most.
    var cb = D.costBasis;
    var rate = (m.cost === null) ? mirrorRate : m.cost;
    var cost = c.cost + (rate - cb.mirrorPerM2) * c.mirrorM2;
    var life = 0, run = -cost, pay = null, cum = [];
    for (var y = 0; y < LIFE; y++) {
      var out = annual*Math.pow(1-deg, y);
      life += out; run += out*RATE; cum.push(run);
      if (pay === null && run >= 0) pay = y+1;
    }
    return { annual:annual, deg:deg, cost:cost, life:life, lcoe:cost/life,
             payback:pay, net:run, cum:cum };
  }

  var stageEl = document.getElementById("stage");
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070a0e);
  scene.fog = new THREE.Fog(0x070a0e, 34, 115);
  var camera = new THREE.PerspectiveCamera(58, 1, 0.05, 400);
  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stageEl.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0x9ec3ff, 0x0a0f16, 0.8));
  var sunLight = new THREE.DirectionalLight(0xfff2d8, 1.25);
  scene.add(sunLight);
  var gnd = new THREE.Mesh(new THREE.PlaneGeometry(400,400),
    new THREE.MeshStandardMaterial({ color:0x0d131b, roughness:1 }));
  gnd.rotation.x = -Math.PI/2; scene.add(gnd);
  var grid = new THREE.GridHelper(200, 100, 0x1b2735, 0x121a25);
  grid.position.y = 0.01; scene.add(grid);

  var matPanel = new THREE.MeshStandardMaterial({ color:0x0d1f38, roughness:0.38, metalness:0.25,
    emissive:0x1b5d9e, emissiveIntensity:0.30, side:THREE.DoubleSide });
  var matPanelSel = new THREE.MeshStandardMaterial({ color:0x123055, roughness:0.32, metalness:0.25,
    emissive:0xffb347, emissiveIntensity:0.34, side:THREE.DoubleSide });
  var matMirror = new THREE.MeshStandardMaterial({ color:0xeef4ff, roughness:0.18, metalness:0.2,
    emissive:0xa9caff, emissiveIntensity:0.26, side:THREE.DoubleSide });
  var matRay = new THREE.LineBasicMaterial({ color:0xffb347, transparent:true, opacity:0.4,
    blending:THREE.AdditiveBlending, depthWrite:false });


  // ---- THE SUN, AND WHERE THE YEAR'S ENERGY COMES FROM ---------------------------------
  // RJ: "the sun angle isn't apparent show the sun and it direction over time". Every mirror
  // in the zoo is verified to bounce light onto a panel (mirror_audit.py checks the reflected
  // ray actually lands on one), but with nothing in shot to read them against, the angles look
  // arbitrary. This draws the SAME vector that lights the scene and that the tracer fired
  // along - plus every sun position the measured year really delivered beam into, each sized
  // by the kWh/m2 that came from it. The big dots are where your energy is.
  var sunGroup = new THREE.Group(); scene.add(sunGroup);
  var sunBall = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18),
    new THREE.MeshBasicMaterial({ color:0xfff0c2 }));
  var sunHalo = new THREE.Mesh(new THREE.SphereGeometry(2.2, 20, 14),
    new THREE.MeshBasicMaterial({ color:0xffb347, transparent:true, opacity:0.15,
      blending:THREE.AdditiveBlending, depthWrite:false }));
  var sunBeam = new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(), new THREE.Vector3()]),
    new THREE.LineBasicMaterial({ color:0xffd479, transparent:true, opacity:0.5 }));
  sunGroup.add(sunHalo); sunGroup.add(sunBall); sunGroup.add(sunBeam);

  function sunDir(az, el) {
    var a = az*Math.PI/180, e = el*Math.PI/180;
    return new THREE.Vector3(Math.cos(e)*Math.sin(a), Math.sin(e), -Math.cos(e)*Math.cos(a));
  }
  // Canvas size is the label's aspect ratio, so the sprite scale has to match it or the text
  // squashes. "az 210 deg el 20 deg" does not fit 128 px at 46 px type - it was being clipped.
  function makeLabel(text, colour, w, px) {
    var cv = document.createElement("canvas"); cv.width = w; cv.height = 72;
    var g = cv.getContext("2d");
    g.font = "bold " + px + "px ui-monospace,monospace"; g.fillStyle = colour;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(text, w/2, 36);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv),
      transparent:true, depthWrite:false, opacity:0.85 }));
    sp.userData.aspect = w/72;
    return sp;
  }

  var BINS = D.sunBins || [];
  var binMax = 1; BINS.forEach(function(b){ if (b[2] > binMax) binMax = b[2]; });
  var binDots = BINS.map(function(){
    var m = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8),
      new THREE.MeshBasicMaterial({ color:0xffb347, transparent:true, opacity:0.45 }));
    sunGroup.add(m); return m;
  });
  // Cardinals, so "az 210" is something you can SEE rather than read off a toolbar.
  var CARD = [["N",0],["E",90],["S",180],["W",270]];
  var cardSprites = CARD.map(function(c){
    var sp = makeLabel(c[0], "#8598ae", 72, 48); sunGroup.add(sp); return sp;
  });
  var sunLabel = makeLabel("", "#ffd479", 256, 40); sunGroup.add(sunLabel);

  var labelFor = -1, sunCentre = new THREE.Vector3(), sunR = 8;
  // The dome is sized off the ARRAY, not the camera: a camera-relative sun slides out
  // of shot the moment it climbs, and the whole point is watching it move.
  function sunRadius(span) { return Math.max(4, span*0.85); }
  function placeSun(centre, R) {
    var s = D.sunList[sunIdx] || [180, 30];
    var p = sunDir(s[0], s[1]).multiplyScalar(R).add(centre);
    var sc = R*0.05;
    sunBall.position.copy(p); sunBall.scale.setScalar(sc);
    sunHalo.position.copy(p); sunHalo.scale.setScalar(sc);
    sunBeam.geometry.setFromPoints([p, centre]);
    sunLabel.position.copy(p).y += sc*2.6;
    var sh = R*0.055; sunLabel.scale.set(sh*sunLabel.userData.aspect, sh, 1);
    if (labelFor !== sunIdx) {
      labelFor = sunIdx;
      var cv = sunLabel.material.map.image, g = cv.getContext("2d");
      g.clearRect(0,0,cv.width,cv.height);
      g.font = "bold 40px ui-monospace,monospace"; g.fillStyle = "#ffd479";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(s[0]+"° az   "+s[1]+"° el", 128, 36);
      sunLabel.material.map.needsUpdate = true;
    }
    BINS.forEach(function(b, i){
      binDots[i].position.copy(sunDir(b[0], b[1]).multiplyScalar(R).add(centre));
      binDots[i].scale.setScalar(R*(0.006 + 0.020*(b[2]/binMax)));
    });
    cardSprites.forEach(function(sp, i){
      sp.position.copy(sunDir(CARD[i][1], 0).multiplyScalar(R*1.02).add(centre));
      sp.position.y = centre.y;
      var ch = R*0.05; sp.scale.set(ch*sp.userData.aspect, ch, 1);
    });
  }

  var groups = [], hoverables = [], cache = {}, order = [];

  function sunKey(i){ var s = D.sunList[i] || D.sunList[0]; return s[0]+"_"+s[1]; }
  function rectMesh(r) {
    var u = new THREE.Vector3(r.u[0], r.u[2], -r.u[1]);
    var v = new THREE.Vector3(r.v[0], r.v[2], -r.v[1]);
    var m = new THREE.Mesh(new THREE.PlaneGeometry(u.length()*2, v.length()*2),
      r.kind === "panel" ? matPanel : matMirror);
    m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
      u.clone().normalize(), v.clone().normalize(),
      new THREE.Vector3().crossVectors(u,v).normalize()));
    m.position.set(r.c[0], r.c[2], -r.c[1]);
    m.userData.role = r.role;
    m.userData.kind = r.kind;
    m.userData.title = r.kind === "panel" ? "PV module" : "Mirror";
    return m;
  }
  function groupFor(ci, sk) {
    var key = mountIdx+"|"+ci+"|"+sk;
    if (cache[key]) return cache[key];
    var f = D.mounts[mountIdx].configs[ci].frames[sk], g = new THREE.Group();
    if (f) {
      f.rects.forEach(function(r){ g.add(rectMesh(r)); });
      var rg = new THREE.Group(); rg.name = "rays";
      f.rays.forEach(function(path){
        rg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
          path.map(function(p){ return new THREE.Vector3(p[0],p[2],-p[1]); })), matRay));
      });
      g.add(rg);
    }
    cache[key] = g; return g;
  }
  // Every rectangle corner, in three.js axes. MEASURED, not assumed: the configs run from
  // a single 1.7 m panel to a heliostat ring wider than the old fixed 9 m spacing, which is
  // exactly why the zoo used to overlap into one unreadable smear.
  var ORIGIN = new THREE.Vector3(0,0,0);
  function boundsOf(ci, sk, withRays) {
    var f = D.mounts[mountIdx].configs[ci].frames[sk], b = new THREE.Box3();
    if (!f) return b;
    f.rects.forEach(function(r){
      for (var a = -1; a <= 1; a += 2) for (var d = -1; d <= 1; d += 2)
        b.expandByPoint(new THREE.Vector3(
           r.c[0] + a*r.u[0] + d*r.v[0],
           r.c[2] + a*r.u[2] + d*r.v[2],
         -(r.c[1] + a*r.u[1] + d*r.v[1])));
    });
    // Rays fall from a launch plane well above the hardware, so framing on the panels alone
    // cuts off the incoming sunlight - which is the thing the demo exists to show.
    if (withRays) f.rays.forEach(function(p){ p.forEach(function(q){
      b.expandByPoint(new THREE.Vector3(q[0], q[2], -q[1])); }); });
    return b;
  }
  function layout() {
    groups.forEach(function(g){ scene.remove(g.holder); });
    groups = [];
    var n = D.mounts[mountIdx].configs.length, cols = Math.ceil(Math.sqrt(n));
    var sk = sunKey(sunIdx), sz = new THREE.Vector3(), span = 0;
    for (var k = 0; k < n; k++) {
      var bk = boundsOf(k, sk, true);
      if (bk.isEmpty()) continue;
      bk.getSize(sz); span = Math.max(span, sz.x, sz.z);
    }
    SPACING = Math.max(6, span*1.35);
    scene.fog.near = SPACING*1.8; scene.fog.far = SPACING*Math.max(cols,4)*2.4;
    for (var i = 0; i < n; i++) {
      var h = new THREE.Group();
      h.userData.grid = new THREE.Vector3((i%cols-(cols-1)/2)*SPACING, 0,
                          (Math.floor(i/cols)-(Math.ceil(n/cols)-1)/2)*SPACING);
      h.position.copy(h.userData.grid);
      scene.add(h); groups.push({ holder:h, ci:i, cur:null });
    }
    refresh();
  }
  function refresh() {
    var sk = sunKey(sunIdx); hoverables = [];
    var selReal = order[cfgIdx];
    var selCi = selReal ? D.mounts[mountIdx].configs.indexOf(selReal) : -1;
    groups.forEach(function(g){
      var mesh = groupFor(g.ci, sk);
      if (g.cur !== mesh) { if (g.cur) g.holder.remove(g.cur); g.holder.add(mesh); g.cur = mesh; }
      // In solo the chosen config moves to the origin so the camera always has it centred.
      var shown = solo ? (g.ci === selCi) : true;
      g.holder.visible = shown;
      g.holder.position.copy(solo ? ORIGIN : g.holder.userData.grid);
      var rg = mesh.getObjectByName("rays"); if (rg) rg.visible = showRays;
      mesh.children.forEach(function(ch){
        if (!ch.isMesh) return;
        ch.userData.cfg = g.ci;
        if (ch.userData.kind === "panel") ch.material = (g.ci === selCi) ? matPanelSel : matPanel;
        // A hidden holder does NOT make its meshes unpickable - the raycaster walks the
        // list it is handed, so the list itself has to exclude them.
        if (shown) hoverables.push(ch);
      });
    });
    // The sun sits at a fraction of the CAMERA's distance, not on a fixed dome. A dome sized
    // from the hardware puts it outside the frustum the moment the camera frames the hardware
    // tightly, which is exactly when you want to see it.
    var selB = selCi >= 0 ? boundsOf(selCi, sk, true) : new THREE.Box3();
    var sunC = (solo && !selB.isEmpty())
      ? selB.getCenter(new THREE.Vector3()).add(groups[selCi].holder.position)
      : new THREE.Vector3(0, 0, 0);
    sunCentre.copy(sunC);
    var sspan = selB.isEmpty() ? SPACING : (function(){ var v = selB.getSize(new THREE.Vector3());
      return Math.max(v.x, v.y, v.z); })();
    sunR = solo ? sunRadius(sspan) : Math.max(14, SPACING*1.6);

    var s = D.sunList[sunIdx], az = s[0]*Math.PI/180, el = s[1]*Math.PI/180;
    sunLight.position.set(Math.cos(el)*Math.sin(az)*40, Math.sin(el)*40, -Math.cos(el)*Math.cos(az)*40);
    document.getElementById("sunv").textContent = "az "+s[0]+"°  el "+s[1]+"°";
    document.getElementById("sun").value = sunIdx;
  }

  function buildTable() {
    var cfgs = D.mounts[mountIdx].configs.slice();
    cfgs.forEach(function(c){ c._e = econ(c); });
    cfgs.sort(function(a,b){
      var x = val(a,sortKey), y = val(b,sortKey);
      return typeof x === "string" ? sortDir*x.localeCompare(y) : sortDir*(x-y);
    });
    order = cfgs;
    if (cfgIdx >= cfgs.length) cfgIdx = 0;

    document.getElementById("hdr").innerHTML = COLS.map(function(col){
      return "<th data-k='"+col.k+"' class='"+(col.k===sortKey?"sorted":"")+"'>"+col.t+
        (col.k===sortKey ? (sortDir>0?" ▲":" ▼") : "")+"</th>";
    }).join("");
    var bestL = Math.min.apply(null, cfgs.map(function(c){ return c._e.lcoe; }));
    var bestN = Math.max.apply(null, cfgs.map(function(c){ return c._e.net; }));
    document.getElementById("rows").innerHTML = cfgs.map(function(c,i){
      return "<tr data-i='"+i+"' class='"+(i===cfgIdx?"on":"")+"'>" + COLS.map(function(col){
        var cls = "num";
        if (col.best === "min" && Math.abs(c._e.lcoe-bestL) < 1e-9) cls += " best";
        if (col.best === "max" && Math.abs(c._e.net-bestN) < 1e-9) cls += " best";
        return "<td class='"+cls+"'>"+col.f(c)+"</td>";
      }).join("") + "</tr>";
    }).join("");
    drawSide();
    refresh();
  }

  function drawSide() {
    var c = order[cfgIdx]; if (!c) return;
    document.getElementById("sname").textContent = c.name;
    document.getElementById("sdet").innerHTML =
      "<div class='r'><span>peak</span><b>"+(c.peak*1000).toFixed(0)+" W</b></div>" +
      "<div class='r'><span>inverter</span><b>"+c.inverterW+" W</b></div>" +
      "<div class='r'><span>hottest cell</span><b>"+c.maxCell.toFixed(0)+"°C</b></div>" +
      "<div class='r'><span>panels per drive</span><b>"+(c.nPanels||1)+"</b></div>" +
      "<div class='r'><span>mirror per panel</span><b>"+c.mirrorM2.toFixed(2)+" m²</b></div>" +
      "<p class='note'>"+(c.note||"")+"</p>";
    var cv = document.getElementById("cum"), x = cv.getContext("2d");
    var W = cv.width, H = cv.height; x.clearRect(0,0,W,H);
    var e = c._e, lo = Math.min(-e.cost,0), hi = Math.max.apply(null,e.cum), span = (hi-lo)||1;
    function Y(v){ return H-(v-lo)/span*(H-10)-5; }
    x.strokeStyle = "#55627a"; x.setLineDash([4,4]); x.lineWidth = 1;
    x.beginPath(); x.moveTo(0,Y(0)); x.lineTo(W,Y(0)); x.stroke(); x.setLineDash([]);
    x.beginPath(); x.moveTo(0,Y(-e.cost));
    e.cum.forEach(function(v,i){ x.lineTo((i+1)/e.cum.length*W, Y(v)); });
    x.strokeStyle = "#7ee787"; x.lineWidth = 2.5; x.stroke();
    if (e.payback) {
      var px = e.payback/e.cum.length*W;
      x.strokeStyle = "#ffb347"; x.lineWidth = 1.5;
      x.beginPath(); x.moveTo(px,0); x.lineTo(px,H); x.stroke();
    }
  }

  var HOME = { x:0, y:7, z:22, yaw:Math.PI, pitch:-0.24 };
  var pos = new THREE.Vector3(HOME.x,HOME.y,HOME.z), yaw = HOME.yaw, pitch = HOME.pitch;
  var keys = {}, drag = false, moved = false, lx = 0, ly = 0;
  var mouse = new THREE.Vector2(), tipXY = [0,0];
  var MOVE = { w:1,a:1,s:1,d:1,q:1,e:1,shift:1 };
  document.addEventListener("keydown", function(ev){
    var k = ev.key.toLowerCase(); if (MOVE[k]) { keys[k] = true; ev.preventDefault(); }
  }, true);
  document.addEventListener("keyup", function(ev){
    var k = ev.key.toLowerCase(); if (MOVE[k]) { keys[k] = false; ev.preventDefault(); }
  }, true);
  addEventListener("blur", function(){ keys = {}; });
  renderer.domElement.addEventListener("mousedown", function(e){
    drag = true; moved = false; lx = e.clientX; ly = e.clientY;
  });
  addEventListener("mouseup", function(){ drag = false; });
  addEventListener("mousemove", function(e){
    var r = stageEl.getBoundingClientRect();
    mouse.x = ((e.clientX-r.left)/r.width)*2-1;
    mouse.y = -((e.clientY-r.top)/r.height)*2+1;
    tipXY = [e.clientX, e.clientY];
    if (!drag) return;
    if (Math.abs(e.clientX-lx) + Math.abs(e.clientY-ly) > 3) moved = true;
    yaw -= (e.clientX-lx)*0.0032;
    pitch = Math.max(-1.45, Math.min(1.45, pitch-(e.clientY-ly)*0.0032));
    lx = e.clientX; ly = e.clientY;
    document.getElementById("tip").style.display = "none";
  });

  // CLICK A SURFACE -> SELECT ITS ROW AND SCROLL THE TABLE TO IT. RJ: "clicking on
  // something will snap you to the html table". A drag that happens to end on geometry
  // is a look-around, not a click, so `moved` guards it.
  renderer.domElement.addEventListener("click", function(){
    if (moved) return;
    var hit = pick();
    if (!hit) return;
    var real = D.mounts[mountIdx].configs[hit.object.userData.cfg];
    var i = order.indexOf(real);
    if (i < 0) return;
    cfgIdx = i; buildTable();
    var row = document.querySelector("#rows tr[data-i='"+i+"']");
    if (row) row.scrollIntoView({ block:"nearest", behavior:"smooth" });
  });

  var ray = new THREE.Raycaster();
  function pick() {
    ray.setFromCamera(mouse, camera);
    return ray.intersectObjects(hoverables, false)[0];
  }
  function hover() {
    var t = document.getElementById("tip");
    var r = stageEl.getBoundingClientRect();
    if (drag || tipXY[1] < r.top || tipXY[1] > r.bottom) { t.style.display = "none"; return; }
    var hit = pick();
    if (!hit) { t.style.display = "none"; return; }
    var c = D.mounts[mountIdx].configs[hit.object.userData.cfg];
    t.style.display = "block";
    t.style.left = Math.min(tipXY[0]+14, innerWidth-295)+"px";
    t.style.top = Math.min(tipXY[1]+14, innerHeight-140)+"px";
    t.innerHTML = "<b>"+hit.object.userData.title+" — "+c.name+"</b>"+hit.object.userData.role+
      "<div style='margin-top:5px;color:#8598ae'>click to jump to its row</div>";
  }

  var lastW = 0, lastH = 0;
  function resize() {
    var w = stageEl.clientWidth, h = stageEl.clientHeight;
    if (!w || !h || (w === lastW && h === lastH)) return;
    lastW = w; lastH = h;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stageEl);

  var last = performance.now(), acc = 0;
  function tick(now) {
    requestAnimationFrame(tick);
    resize(); if (!lastW) return;
    var dt = Math.min((now-last)/1000, 0.1); last = now;
    var sp = (keys["shift"]?26:9)*dt;
    var fwd = new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch),
                                Math.cos(yaw)*Math.cos(pitch)).normalize();
    var right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
    if (keys["w"]) pos.addScaledVector(fwd, sp);
    if (keys["s"]) pos.addScaledVector(fwd, -sp);
    if (keys["a"]) pos.addScaledVector(right, -sp);
    if (keys["d"]) pos.addScaledVector(right, sp);
    if (keys["e"]) pos.y += sp;
    if (keys["q"]) pos.y -= sp;
    pos.y = Math.max(0.4, pos.y);
    camera.position.copy(pos); camera.lookAt(pos.clone().add(fwd));
    // Every frame, because flyTo moves the camera without going through refresh(), and a sun
    // pinned to the old camera distance ends up behind you the moment the view changes.
    placeSun(sunCentre, sunR);
    if (playing) { acc += dt; if (acc > 1.1) { acc = 0; sunIdx = (sunIdx+1)%D.sunList.length; refresh(); } }
    hover();
    renderer.render(scene, camera);
  }

  // Frame the config from its own size, so a bare 1.7 m panel and an 8-mirror ring both
  // fill the view instead of one being a speck and the other running off the edges.
  function flyTo(i) {
    var real = order[i], ci = D.mounts[mountIdx].configs.indexOf(real), g = groups[ci];
    if (!g) return;
    var b = boundsOf(ci, sunKey(sunIdx), showRays);
    if (b.isEmpty()) { pos.set(g.holder.position.x, 3.6, g.holder.position.z+9); yaw = Math.PI; pitch = -0.17; return; }
    var c = b.getCenter(new THREE.Vector3()).add(g.holder.position);
    var sz = b.getSize(new THREE.Vector3()), span = Math.max(sz.x, sz.y, sz.z);
    // Include the sun dome, or the sun is out of shot exactly when it climbs.
    span = Math.max(span, sunRadius(span)*1.75);
    // 1.15, not 1.5: the bounds already include the ray launch plane well above the
    // hardware, so a generous margin on top of that parked the rig in the far distance.
    var dist = Math.max(3, (span*0.5)/Math.tan(camera.fov*Math.PI/360)*1.15);
    // STAND SQUARE TO THE ARRAY, ON THE SUNNY SIDE. A camera on a fixed bearing sees a
    // 12-panel wing end-on as a receding line, and the sun's own bearing is no better: the
    // platforms do not sit perpendicular to it (the 1x12 wing runs on a ~30 deg bearing while
    // the sun is due east). So take the array's OWN long axis from its panel centres, look
    // along the perpendicular to it, and pick the side the sun is on so the lit face is
    // toward you. A single-panel design has no long axis, and there the sun bearing is right.
    var sun = D.sunList[sunIdx] || [180, 30];
    var sa = sun[0]*Math.PI/180;
    var hx = Math.sin(sa), hz = -Math.cos(sa);          // sun bearing, horizontal, three axes
    var fr = D.mounts[mountIdx].configs[ci].frames[sunKey(sunIdx)];
    if (fr) {
      var pc = [], i, j;
      for (i = 0; i < fr.rects.length; i++)
        if (fr.rects[i].kind === "panel") pc.push([fr.rects[i].c[0], -fr.rects[i].c[1]]);
      var bx = 0, bz = 0, best = 0;
      for (i = 0; i < pc.length; i++) for (j = i+1; j < pc.length; j++) {
        var ddx = pc[j][0]-pc[i][0], ddz = pc[j][1]-pc[i][1], d2 = ddx*ddx + ddz*ddz;
        if (d2 > best) { best = d2; bx = ddx; bz = ddz; }
      }
      if (best > 1.0) {                                  // a real spread, not one panel
        var L = Math.sqrt(best), px = -bz/L, pz = bx/L;  // perpendicular to the long axis
        if (px*hx + pz*hz < 0) { px = -px; pz = -pz; }   // keep the sunlit face toward us
        hx = px; hz = pz;
      }
    }
    var dy = Math.max(1.6, span*0.42);
    pos.set(c.x + hx*dist, Math.max(0.6, c.y + dy), c.z + hz*dist);
    var dx = pos.x-c.x, dz = pos.z-c.z;
    yaw = Math.atan2(-dx, -dz);
    pitch = -Math.atan2(pos.y-c.y, Math.sqrt(dx*dx + dz*dz));
  }
  // "reset view" has to know how big the zoo actually got: SPACING is measured now, so the
  // old hardcoded HOME either sat inside the grid or cut half of it off.
  function resetView() {
    if (solo) { flyTo(cfgIdx); return; }
    var n = groups.length || 1, cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n/cols);
    var span = Math.max(cols, rows)*SPACING;
    var dist = (span*0.5)/Math.tan(camera.fov*Math.PI/360)*1.15;
    pos.set(0, Math.max(6, span*0.42), rows*SPACING*0.5 + dist*0.55);
    yaw = Math.PI; pitch = -Math.atan2(pos.y, pos.z);
  }
  function selectCfg(i) {
    var n = order.length; cfgIdx = ((i%n)+n)%n;
    buildTable(); flyTo(cfgIdx);
    var row = document.querySelector("#rows tr[data-i='"+cfgIdx+"']");
    if (row) row.scrollIntoView({ block:"nearest" });
  }

  var msel = document.getElementById("mount");
  msel.innerHTML = D.mounts.map(function(m,i){ return "<option value='"+i+"'>"+m.label+"</option>"; }).join("");
  msel.value = mountIdx;
  msel.addEventListener("change", function(){ mountIdx = +this.value; cfgIdx = 0; layout(); buildTable(); this.blur(); });

  var mat = document.getElementById("material");
  mat.innerHTML = MATERIALS.map(function(m,i){
    return "<option value='"+i+"'>"+m.n+(m.cost===null?"":" — $"+m.cost+"/m²")+"</option>"; }).join("");
  mat.value = matIdx;
  function setMat() {
    matIdx = +mat.value;
    var m = MATERIALS[matIdx];
    document.getElementById("matnote").innerHTML = m.note +
      " <b>"+(m.refl*100).toFixed(0)+"% reflective, "+(m.deg*100).toFixed(1)+"%/yr decay.</b>";
    document.getElementById("mirror").disabled = (m.cost !== null);
    buildTable();
  }
  mat.addEventListener("change", function(){ setMat(); this.blur(); });

  var msl = document.getElementById("mirror");
  function setMirror() {
    mirrorRate = +msl.value;
    document.getElementById("mrate").textContent = "$"+mirrorRate;
    buildTable();
  }
  msl.addEventListener("input", setMirror);
  msl.addEventListener("change", function(){ this.blur(); });

  document.getElementById("hdr").addEventListener("click", function(e){
    var th = e.target.closest("th"); if (!th) return;
    if (th.dataset.k === sortKey) sortDir = -sortDir; else { sortKey = th.dataset.k; sortDir = 1; }
    buildTable();
  });
  document.getElementById("rows").addEventListener("click", function(e){
    var tr = e.target.closest("tr"); if (!tr) return;
    cfgIdx = +tr.dataset.i; buildTable(); flyTo(cfgIdx);
  });
  document.getElementById("play").addEventListener("click", function(){
    this.blur(); playing = !playing;
    this.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
    this.classList.toggle("on", !playing);
  });
  document.getElementById("rays").addEventListener("click", function(){
    this.blur(); showRays = !showRays; this.classList.toggle("on", !showRays); refresh();
  });
  document.getElementById("solo").addEventListener("click", function(){
    this.blur(); solo = !solo; this.classList.toggle("on", solo);
    refresh(); if (solo) flyTo(cfgIdx); else resetView();
  });
  document.getElementById("prev").addEventListener("click", function(){ this.blur(); selectCfg(cfgIdx-1); });
  document.getElementById("next").addEventListener("click", function(){ this.blur(); selectCfg(cfgIdx+1); });
  var cycleTimer = null;
  document.getElementById("cycle").addEventListener("click", function(){
    this.blur();
    if (cycleTimer) { clearInterval(cycleTimer); cycleTimer = null; this.classList.remove("on"); }
    else { cycleTimer = setInterval(function(){ selectCfg(cfgIdx+1); }, 4000); this.classList.add("on"); }
  });
  document.getElementById("reset").addEventListener("click", function(){ this.blur(); resetView(); });
  document.getElementById("sun").addEventListener("input", function(){
    playing = false;
    document.getElementById("play").innerHTML = "&#9654;";
    sunIdx = +this.value; refresh();
  });
  document.getElementById("sun").max = D.sunList.length - 1;

  var cb = D.costBasis;
  document.getElementById("basis").innerHTML =
    "Panel $"+cb.panelPerM2.toFixed(0)+"/m² is READ from a real listing. ESTIMATES: panel racking $"+
    cb.boxPerM2+"/m², mirror backing $"+cb.mirrorBackPerM2+"/m² (ply and fixings — a plastic "+
    "mirror is not a 20 kg glass module and must not be charged panel racking), actuator $"+cb.axisCost+
    "/axis, and $"+cb.heliostatDrive+" per heliostat — a ring cannot share one shaft, since every "+
    "mirror needs its own two axes. Mirrors defocus when the cell or inverter would be overrun. "+
    "Sampling carries ~±5%, so gaps narrower than that are not real differences.";

  layout(); setMirror(); setMat(); resetView(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
