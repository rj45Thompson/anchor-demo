<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar setup - 3D ray-traced configuration zoo</title>
<style>
  :root { --bg:#070a0e; --panel:#121823; --line:#242e3d; --ink:#e8eef7; --dim:#8598ae;
          --hot:#ffb347; --cool:#4fd1c5; --bad:#f07178; --good:#7ee787; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { position:absolute; inset:0; width:100% !important; height:100% !important; display:block; }
  .hud { position:fixed; background:rgba(18,24,35,.95); border:1px solid var(--line);
    border-radius:9px; padding:11px 13px; backdrop-filter:blur(7px); }
  #left { top:12px; left:12px; width:310px; max-height:calc(100% - 150px); overflow:auto; }
  #bot { left:12px; bottom:12px; right:12px; display:flex; gap:10px; align-items:center;
    flex-wrap:wrap; }
  h1 { font-size:12.5px; margin:0 0 3px; letter-spacing:.06em; }
  p.s { margin:0 0 8px; color:var(--dim); font-size:10.5px; }
  h2 { font-size:10px; margin:12px 0 6px; color:var(--dim); letter-spacing:.09em;
    text-transform:uppercase; }
  select, button { background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; font:inherit; font-size:11.5px; cursor:pointer; }
  select { width:100%; }
  button:hover, select:hover { border-color:var(--cool); }
  .row { display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .row span { color:var(--dim); }
  .cfg { border:1px solid var(--line); border-radius:7px; padding:7px 9px; margin-bottom:6px;
    cursor:pointer; }
  .cfg:hover { border-color:var(--cool); }
  .cfg.on { border-color:var(--hot); background:rgba(255,179,71,.09); }
  .cfg .n { font-weight:700; font-size:11px; margin-bottom:4px; }
  .peak { background:rgba(126,231,135,.13); border:1px solid rgba(126,231,135,.45);
    border-radius:5px; padding:3px 6px; margin:4px 0; display:flex;
    justify-content:space-between; }
  .peak b { color:var(--good); font-size:13px; }
  .win { color:var(--good); } .lose { color:var(--bad); }
  #tip { position:fixed; max-width:260px; padding:8px 10px; background:rgba(10,14,20,.97);
    border:1px solid var(--cool); border-radius:7px; font-size:11px; line-height:1.45;
    pointer-events:none; display:none; z-index:50; }
  #tip b { color:var(--cool); display:block; margin-bottom:3px; }
  #keys { position:fixed; right:12px; top:12px; font-size:10.5px; color:var(--dim);
    text-align:right; }
  kbd { background:var(--panel); border:1px solid var(--line); border-radius:3px;
    padding:0 4px; color:var(--ink); }
  #err { position:fixed; inset:0; display:none; place-items:center; padding:40px;
    text-align:center; color:var(--bad); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="tip"></div>

<div class="hud" id="keys">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> fly &nbsp; <kbd>Q</kbd><kbd>E</kbd> down/up<br>
  drag to look &nbsp; <kbd>shift</kbd> boost<br>
  hover any part for what it is
</div>

<div class="hud" id="left">
  <h1>SOLAR SETUP &mdash; 3D ZOO</h1>
  <p class="s">True 3D ray tracing against a measured year at 53.63&deg;N.
     Every number below is traced, not rated.</p>
  <h2>Mount</h2>
  <select id="mount"></select>
  <h2>Configurations</h2>
  <div id="list"></div>
  <p class="s" id="basis" style="margin-top:10px"></p>
</div>

<div class="hud" id="bot">
  <button id="play">&#10073;&#10073;</button>
  <span style="color:var(--dim)">sun</span>
  <input type="range" id="sun" min="0" max="14" step="1" value="4" style="flex:1;accent-color:var(--hot)">
  <span id="sunv" style="width:120px;text-align:right;color:var(--dim)"></span>
  <button id="rays">rays: on</button>
  <button id="reset">reset view</button>
</div>

<div id="err"></div>

<script src="../three.min.js"></script>
<script src="zoo3d.js"></script>
<script>
(function () {
  "use strict";
  var D = window.SOLAR_ZOO3D;
  if (!D || !window.THREE) {
    var e = document.getElementById("err");
    e.style.display = "grid";
    e.textContent = !window.THREE ? "three.min.js did not load." : "zoo3d.js did not load.";
    return;
  }

  var stageEl = document.getElementById("stage");
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070a0e);
  scene.fog = new THREE.Fog(0x070a0e, 30, 95);
  var camera = new THREE.PerspectiveCamera(58, 1, 0.05, 400);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stageEl.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0x9ec3ff, 0x0a0f16, 0.75));
  var sunLight = new THREE.DirectionalLight(0xfff2d8, 1.25);
  scene.add(sunLight);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: 0x0e141d, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  var grid = new THREE.GridHelper(200, 100, 0x1b2735, 0x121a25);
  grid.position.y = 0.01;
  scene.add(grid);

  // Materials. NOT metalness 1 - with no environment map a metal renders black, which is
  // how the mirrors first came out: dark slabs, the opposite of legible.
  var matPanel = new THREE.MeshStandardMaterial({ color:0x0d1f38, roughness:0.38, metalness:0.25,
    emissive:0x1b5d9e, emissiveIntensity:0.30, side:THREE.DoubleSide });
  var matMirror = new THREE.MeshStandardMaterial({ color:0xeef4ff, roughness:0.18, metalness:0.2,
    emissive:0xa9caff, emissiveIntensity:0.26, side:THREE.DoubleSide });
  var matRay = new THREE.LineBasicMaterial({ color:0xffb347, transparent:true, opacity:0.42,
    blending:THREE.AdditiveBlending, depthWrite:false });

  var SPACING = 9.0;
  var mountIdx = 0, cfgIdx = 0, sunIdx = 4, playing = true, showRays = true;
  var groups = [], hoverables = [], cache = {};

  function sunKey(i) {
    var s = D.sunList[i] || D.sunList[0];
    return s[0] + "_" + s[1];
  }

  function rectMesh(r) {
    var u = new THREE.Vector3(r.u[0], r.u[2], -r.u[1]);   // data is x,y,z-up -> three is y-up
    var v = new THREE.Vector3(r.v[0], r.v[2], -r.v[1]);
    var c = new THREE.Vector3(r.c[0], r.c[2], -r.c[1]);
    var w = u.length() * 2, h = v.length() * 2;
    var g = new THREE.PlaneGeometry(w, h);
    var m = new THREE.Mesh(g, r.kind === "panel" ? matPanel : matMirror);
    var n = new THREE.Vector3().crossVectors(u, v).normalize();
    var basis = new THREE.Matrix4().makeBasis(u.clone().normalize(), v.clone().normalize(), n);
    m.quaternion.setFromRotationMatrix(basis);
    m.position.copy(c);
    m.userData.role = r.role;
    m.userData.title = r.kind === "panel" ? "PV module" : "Mirror";
    return m;
  }

  function buildGroup(mi, ci, sk) {
    var key = mi + "|" + ci + "|" + sk;
    if (cache[key]) return cache[key];
    var cfg = D.mounts[mi].configs[ci];
    var f = cfg.frames[sk];
    var g = new THREE.Group();
    if (f) {
      f.rects.forEach(function (r) { g.add(rectMesh(r)); });
      var rg = new THREE.Group(); rg.name = "rays";
      f.rays.forEach(function (path) {
        var pts = path.map(function (p) { return new THREE.Vector3(p[0], p[2], -p[1]); });
        rg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), matRay));
      });
      g.add(rg);
    }
    cache[key] = g;
    return g;
  }

  function layout() {
    groups.forEach(function (g) { scene.remove(g.holder); });
    groups = [];
    var cfgs = D.mounts[mountIdx].configs;
    var cols = Math.ceil(Math.sqrt(cfgs.length));
    cfgs.forEach(function (c, i) {
      var h = new THREE.Group();
      h.position.set((i % cols - (cols - 1) / 2) * SPACING, 0,
                     (Math.floor(i / cols) - (Math.ceil(cfgs.length / cols) - 1) / 2) * SPACING);
      scene.add(h);
      groups.push({ holder: h, ci: i, cur: null });
    });
    refresh();
    buildList();
  }

  function refresh() {
    var sk = sunKey(sunIdx);
    hoverables = [];
    groups.forEach(function (g) {
      var mesh = buildGroup(mountIdx, g.ci, sk);
      if (g.cur !== mesh) { if (g.cur) g.holder.remove(g.cur); g.holder.add(mesh); g.cur = mesh; }
      var rg = mesh.getObjectByName("rays"); if (rg) rg.visible = showRays;
      mesh.children.forEach(function (ch) {
        if (ch.isMesh) { ch.userData.cfg = g.ci; hoverables.push(ch); }
      });
    });
    var s = D.sunList[sunIdx];
    var az = s[0] * Math.PI / 180, el = s[1] * Math.PI / 180;
    sunLight.position.set(Math.cos(el) * Math.sin(az) * 40, Math.sin(el) * 40,
                          -Math.cos(el) * Math.cos(az) * 40);
    document.getElementById("sunv").textContent = "az " + s[0] + "°  el " + s[1] + "°";
    document.getElementById("sun").value = sunIdx;
  }

  function buildList() {
    var cfgs = D.mounts[mountIdx].configs;
    var html = "";
    cfgs.forEach(function (c, i) {
      html += "<div class='cfg" + (i === cfgIdx ? " on" : "") + "' data-i='" + i + "'>" +
        "<div class='n'>" + c.name + "</div>" +
        "<div class='peak'><span>peak power</span><b>" + (c.peak * 1000).toFixed(0) + " W</b></div>" +
        "<div class='row'><span>annual</span><b>" + c.annual.toFixed(0) + " kWh</b></div>" +
        "<div class='row'><span>cost</span><b>$" + c.cost.toFixed(0) + "</b></div>" +
        "<div class='row'><span>kWh per $</span><b class='" + (c.vsBare >= 0 ? "win" : "lose") +
          "'>" + c.perDollar.toFixed(3) + "</b></div>" +
        "<div class='row'><span>vs bare fixed</span><b class='" + (c.vsBare >= 0 ? "win" : "lose") +
          "'>" + (c.vsBare >= 0 ? "+" : "") + c.vsBare.toFixed(1) + "%</b></div>" +
        "<div class='row'><span>hottest cell</span><b>" + c.maxCell.toFixed(0) + "°C</b></div>" +
        "</div>";
    });
    document.getElementById("list").innerHTML = html;
  }

  // ---- fly camera ---------------------------------------------------------------
  // yaw 0 gives forward = +z, so a camera parked at +z was staring away from the scene at
  // an empty field. Facing the origin means yaw = PI.
  var HOME = { x: 0, y: 6, z: 18, yaw: Math.PI, pitch: -0.22 };
  var pos = new THREE.Vector3(HOME.x, HOME.y, HOME.z), yaw = HOME.yaw, pitch = HOME.pitch;
  var keys = {}, drag = false, lx = 0, ly = 0;
  addEventListener("keydown", function (e) { keys[e.key.toLowerCase()] = true; });
  addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  renderer.domElement.addEventListener("mousedown", function (e) { drag = true; lx = e.clientX; ly = e.clientY; });
  addEventListener("mouseup", function () { drag = false; });
  addEventListener("mousemove", function (e) {
    var t = document.getElementById("tip");
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    tipXY = [e.clientX, e.clientY];
    if (!drag) return;
    yaw -= (e.clientX - lx) * 0.0032;
    pitch = Math.max(-1.45, Math.min(1.45, pitch - (e.clientY - ly) * 0.0032));
    lx = e.clientX; ly = e.clientY;
    t.style.display = "none";
  });

  function fly(dt) {
    var sp = (keys["shift"] ? 26 : 9) * dt;
    var fwd = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch),
                                Math.cos(yaw) * Math.cos(pitch)).normalize();
    var right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    if (keys["w"]) pos.addScaledVector(fwd, sp);
    if (keys["s"]) pos.addScaledVector(fwd, -sp);
    if (keys["a"]) pos.addScaledVector(right, -sp);
    if (keys["d"]) pos.addScaledVector(right, sp);
    if (keys["e"]) pos.y += sp;
    if (keys["q"]) pos.y -= sp;
    pos.y = Math.max(0.4, pos.y);
    camera.position.copy(pos);
    camera.lookAt(pos.clone().add(fwd));
  }

  // ---- hover --------------------------------------------------------------------
  var ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tipXY = [0, 0];
  function hover() {
    var t = document.getElementById("tip");
    if (drag) { t.style.display = "none"; return; }
    ray.setFromCamera(mouse, camera);
    var hit = ray.intersectObjects(hoverables, false)[0];
    if (!hit) { t.style.display = "none"; return; }
    var c = D.mounts[mountIdx].configs[hit.object.userData.cfg];
    t.style.display = "block";
    t.style.left = Math.min(tipXY[0] + 14, innerWidth - 275) + "px";
    t.style.top = Math.min(tipXY[1] + 14, innerHeight - 130) + "px";
    t.innerHTML = "<b>" + hit.object.userData.title + " &mdash; " + c.name + "</b>" +
      hit.object.userData.role +
      "<div style='margin-top:6px;color:#8598ae'>This design: " + c.annual.toFixed(0) +
      " kWh/yr, $" + c.cost.toFixed(0) + ", " + c.perDollar.toFixed(3) + " kWh/$</div>";
  }

  // ---- sizing: measure the CONTAINER, never innerWidth. Born inside a hidden tab this
  // page otherwise keeps three.js's default 300x150 buffer and renders as a black
  // rectangle with the HUD floating over it.
  var lastW = 0, lastH = 0;
  function resize() {
    var w = stageEl.clientWidth, h = stageEl.clientHeight;
    if (!w || !h || (w === lastW && h === lastH)) return;
    lastW = w; lastH = h;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stageEl);

  var last = performance.now(), acc = 0;
  function tick(now) {
    requestAnimationFrame(tick);
    resize();
    if (!lastW) return;
    var dt = Math.min((now - last) / 1000, 0.1); last = now;
    fly(dt);
    if (playing) {
      acc += dt;
      if (acc > 1.1) { acc = 0; sunIdx = (sunIdx + 1) % D.sunList.length; refresh(); }
    }
    hover();
    renderer.render(scene, camera);
  }

  // ---- controls -----------------------------------------------------------------
  var msel = document.getElementById("mount");
  msel.innerHTML = D.mounts.map(function (m, i) {
    return "<option value='" + i + "'>" + m.label + "</option>";
  }).join("");
  msel.value = D.mounts.length - 1;   // open on the ground mount: it has the most to show
  mountIdx = D.mounts.length - 1;
  msel.addEventListener("change", function () {
    mountIdx = +this.value; cfgIdx = 0; layout();
  });
  document.getElementById("list").addEventListener("click", function (e) {
    var el = e.target.closest(".cfg"); if (!el) return;
    cfgIdx = +el.dataset.i; buildList();
    var g = groups[cfgIdx];
    if (g) { pos.set(g.holder.position.x, 3.2, g.holder.position.z + 7.5); yaw = Math.PI; pitch = -0.18; }
  });
  document.getElementById("play").addEventListener("click", function () {
    playing = !playing; this.innerHTML = playing ? "&#10073;&#10073;" : "&#9654;";
  });
  document.getElementById("rays").addEventListener("click", function () {
    showRays = !showRays; this.textContent = "rays: " + (showRays ? "on" : "off"); refresh();
  });
  document.getElementById("reset").addEventListener("click", function () {
    pos.set(HOME.x, HOME.y, HOME.z); yaw = HOME.yaw; pitch = HOME.pitch;
  });
  document.getElementById("sun").addEventListener("input", function () {
    playing = false; document.getElementById("play").innerHTML = "&#9654;";
    sunIdx = +this.value; refresh();
  });
  document.getElementById("sun").max = D.sunList.length - 1;

  var cb = D.costBasis;
  document.getElementById("basis").innerHTML =
    "Panel $" + cb.panelPerM2.toFixed(0) + "/m&sup2; is READ from a real listing. " +
    "Mirror $" + cb.mirrorPerM2 + "/m&sup2;, structure $" + cb.boxPerM2 + "/m&sup2; and " +
    "actuator $" + cb.axisCost + "/axis are ESTIMATES. Mirrors are defocused when the cell " +
    "or the inverter would be overrun, so surplus light is declined rather than wasted.";

  layout();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
